<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শ্রী শ্রী মা মনসা মন্দির, গৈলা</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Supabase Configuration ---
        const SUPABASE_URL = 'https://abdgizkkfyhewehfearj.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_MsM2-K03tGNU3G-WWZvYUA_lKu53oT9';
        
        // Initialize Supabase Client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // গ্যালারির ছবিগুলো (একই ফোল্ডারে ছবিগুলো রাখতে হবে)
        const galleryImages = [
          'header image.jpg',
          'gallary image.jpg',
          'galarry image 2.jpg'
        ];

        // --- Fallback Data (যদি কোনো কারণে ডাটাবেস থেকে ডাটা না আসে) ---
        const initialCommittee = [
          { id: 1, name: 'ড: বিনয় ভূষণ রায়', role: 'সভাপতি', phone: '০১৭১৭৫০৩৬৫৭', image: null },
          { id: 2, name: 'গৌরাঙ্গ লাল বাড়ৈ', role: 'সিনিয়র সহ সভাপতি', phone: '০১৭১৩৭৯৮৭৯৮', image: null },
          { id: 3, name: 'সুশান্ত কর্মকার (১)', role: 'সহ সভাপতি', phone: '০১৬১৬৯৫২৯২০', image: null },
          { id: 4, name: 'ডা: দিলীপ কুমার দাস', role: 'সাধারণ সম্পাদক', phone: '০১৭১৫০৩২৭৯৯', image: null },
          { id: 5, name: 'শ্রী আশিষ তপাদার', role: 'সহ সাধারণ সম্পাদক', phone: '০১৭১৫২৪৩৯২৪', image: null },
          { id: 6, name: 'কাজল দাশগুপ্ত', role: 'যুগ্ম সধারণ সম্পাদক–১', phone: '০১৬১১০৪০৫০৮', image: null },
          { id: 7, name: 'শ্রী প্রসেনজিৎ দে', role: 'যুগ্ম সধারণ সম্পাদক–২', phone: '০১৭৩৫৭৩৭৩০৮', image: null }
        ];

        const initialTestimonials = [
          { id: 1, date: '১৬/০২/২০২৮', name: 'মোঃ দেলোয়ার হোসেন', designation: 'অতিঃ পরিচালক, বাংলাদেশ ব্যাংক', text: 'দেবীর সকল ভক্তদের মঙ্গল কামনা করছি। দেবীর আশির্বাদে জগতের সকলের মঙ্গল সাধিত হোক।' },
          { id: 2, date: '২০/১২/২৩', name: 'রুম্পা সিকদার', designation: 'অতিরিক্ত জেলা প্রশাসক (শিক্ষা ও আইসিটি) বরিশাল', text: 'আজ সোমবার বিকাল ৪.৩০ মিনিটে মনসা মন্দির পরিদর্শন করার সৌভাগ্য হয়। এখানে এসিল্যান্ড বার্নীন সহ অন্যান্য গন্যমান্য ব্যক্তিবর্গ উপস্থিত ছিলেন। কবি বিজয় গুপ্ত প্রতিষ্ঠিত মনসা মন্দির সম্পর্কে অনেক তথ্য শুনে সমৃদ্ধ হলাম।' }
        ];

        const initialEvents = [
          { id: 1, title: 'শ্রাবণ মাসের বিশেষ পূজা ও রয়ানী গান', date: '১৫ শ্রাবণ, ১৪৩১', description: 'ঐতিহ্যবাহী রয়ানী গান এবং বিশেষ পূজা অর্চনার আয়োজন করা হয়েছে। সকল ভক্তবৃন্দ আমন্ত্রিত।' }
        ];

        const initialNotices = [
          { id: 1, date: '০১ জানুয়ারি, ২০২৪', title: 'নতুন কমিটি গঠন', text: 'আগামী ৩ বছরের জন্য নতুন মন্দির পরিচালনা পর্ষদ গঠন করা হয়েছে।' }
        ];

        function App() {
          // --- State Management ---
          const [currentPage, setCurrentPage] = useState('home');
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isLoading, setIsLoading] = useState(true);
          const [dbError, setDbError] = useState(false);
          
          const [marqueeText, setMarqueeText] = useState('মন্দিরে স্বাগতম ✦ মায়ের আশীর্বাদ আপনার সহায় হোক ✦ ঐশ্বরিক উপস্থিতি অনুভব করুন');
          const [committeeMembers, setCommitteeMembers] = useState(initialCommittee);
          const [testimonials, setTestimonials] = useState(initialTestimonials);
          const [events, setEvents] = useState(initialEvents);
          const [notices, setNotices] = useState(initialNotices);
          
          const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);

          // --- Fetch Data from Supabase ---
          useEffect(() => {
            fetchData();
          }, []);

          const fetchData = async () => {
            setIsLoading(true);
            setDbError(false);
            try {
                // Fetch Settings (Marquee)
                const { data: settingsData, error: settingsError } = await supabaseClient.from('settings').select('*').eq('key', 'marquee').single();
                if(settingsData) setMarqueeText(settingsData.value);

                // Fetch Committee
                const { data: committeeData, error: committeeError } = await supabaseClient.from('committee').select('*').order('id', { ascending: true });
                if(committeeData && committeeData.length > 0) setCommitteeMembers(committeeData);
                if(committeeError) throw committeeError;

                // Fetch Testimonials
                const { data: testimonialsData } = await supabaseClient.from('testimonials').select('*').order('id', { ascending: false });
                if(testimonialsData && testimonialsData.length > 0) setTestimonials(testimonialsData);

                // Fetch Events
                const { data: eventsData } = await supabaseClient.from('events').select('*').order('id', { ascending: false });
                if(eventsData && eventsData.length > 0) setEvents(eventsData);
                
                // Fetch Notices
                const { data: noticesData } = await supabaseClient.from('notices').select('*').order('id', { ascending: false });
                if(noticesData && noticesData.length > 0) setNotices(noticesData);

            } catch (error) {
                console.error("Supabase Database Error:", error);
                setDbError(true);
            } finally {
                setIsLoading(false);
            }
          };

          // --- Navigation Function ---
          const navigateTo = (page) => {
            setCurrentPage(page);
            setIsMenuOpen(false);
            window.scrollTo(0, 0);
          };

          // --- Components ---
          const Header = () => (
            <header className="bg-gradient-to-r from-orange-600 to-red-600 text-white shadow-lg sticky top-0 z-50">
              <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigateTo('home')}>
                  <div className="w-12 h-12 md:w-14 md:h-14 bg-white rounded-full flex items-center justify-center overflow-hidden border-2 border-yellow-400">
                     <img src="logo (1).jpg" alt="Logo" className="w-full h-full object-cover" />
                  </div>
                  <div>
                    <h1 className="text-xl md:text-2xl font-bold font-serif">শ্রী শ্রী মা মনসা মন্দির</h1>
                    <p className="text-xs text-yellow-200">গৈলা, আগৈলঝাড়া, বরিশাল</p>
                  </div>
                </div>

                {/* Desktop Menu */}
                <nav className="hidden lg:flex items-center gap-5 font-medium text-sm xl:text-base">
                  <button onClick={() => navigateTo('home')} className="hover:text-yellow-300 transition-colors">হোম</button>
                  <button onClick={() => navigateTo('history')} className="hover:text-yellow-300 transition-colors">ইতিহাস</button>
                  <button onClick={() => navigateTo('committee')} className="hover:text-yellow-300 transition-colors">কমিটি</button>
                  <button onClick={() => navigateTo('event')} className="hover:text-yellow-300 transition-colors">ইভেন্ট</button>
                  <button onClick={() => navigateTo('notice')} className="hover:text-yellow-300 transition-colors flex items-center gap-1"><i className="fas fa-bell"></i> নোটিশ বোর্ড</button>
                  <button onClick={() => navigateTo('testimonials')} className="hover:text-yellow-300 transition-colors">মতামত</button>
                  <button onClick={() => navigateTo('donation')} className="bg-yellow-500 text-orange-900 px-4 py-2 rounded-full font-bold hover:bg-yellow-400 transition-colors shadow-md flex items-center gap-1">
                    <i className="fas fa-heart"></i> প্রণামী
                  </button>
                </nav>

                <div className="flex items-center gap-3 lg:hidden">
                   <button onClick={() => navigateTo('donation')} className="bg-yellow-500 text-orange-900 p-2 rounded-full font-bold hover:bg-yellow-400 shadow-md">
                    <i className="fas fa-heart"></i>
                  </button>
                  <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="text-white p-2 text-2xl">
                    <i className={isMenuOpen ? "fas fa-times" : "fas fa-bars"}></i>
                  </button>
                </div>
              </div>

              {/* Mobile Menu */}
              {isMenuOpen && (
                <div className="lg:hidden bg-orange-700 absolute w-full left-0 top-full shadow-xl flex flex-col font-medium border-t border-orange-500 z-50">
                  <button onClick={() => navigateTo('home')} className="py-3 px-6 text-left border-b border-orange-600 hover:bg-orange-600">হোম</button>
                  <button onClick={() => navigateTo('history')} className="py-3 px-6 text-left border-b border-orange-600 hover:bg-orange-600">ইতিহাস</button>
                  <button onClick={() => navigateTo('committee')} className="py-3 px-6 text-left border-b border-orange-600 hover:bg-orange-600">কমিটি</button>
                  <button onClick={() => navigateTo('event')} className="py-3 px-6 text-left border-b border-orange-600 hover:bg-orange-600">ইভেন্ট</button>
                  <button onClick={() => navigateTo('notice')} className="py-3 px-6 text-left border-b border-orange-600 hover:bg-orange-600 flex items-center gap-2"><i className="fas fa-bell"></i> নোটিশ বোর্ড</button>
                  <button onClick={() => navigateTo('testimonials')} className="py-3 px-6 text-left border-b border-orange-600 hover:bg-orange-600">মতামত</button>
                  <button onClick={() => navigateTo('admin')} className="py-3 px-6 text-left bg-gray-800 text-gray-200 flex items-center gap-2">
                    <i className="fas fa-cog"></i> এডমিন প্যানেল
                  </button>
                </div>
              )}
            </header>
          );

          const Footer = () => (
            <footer className="bg-gray-900 text-orange-100 pt-12 pb-6 border-t-4 border-orange-600">
              <div className="container mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                <div>
                  <h3 className="text-2xl font-bold text-yellow-500 mb-4 flex items-center gap-2">
                    শ্রী শ্রী মা মনসা মন্দির
                  </h3>
                  <p className="mb-4 text-gray-400">কবি বিজয় গুপ্তের প্রতিষ্ঠিত ঐতিহাসিক মন্দির। মায়ের আশীর্বাদে সবার জীবনে শান্তি ও সমৃদ্ধি নেমে আসুক।</p>
                  <div className="flex gap-4">
                    <a href="https://www.facebook.com" target="_blank" rel="noreferrer" className="w-10 h-10 bg-orange-800 rounded-full flex items-center justify-center hover:bg-blue-600 transition-colors">
                      <i className="fab fa-facebook-f"></i>
                    </a>
                  </div>
                </div>
                <div>
                  <h4 className="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">প্রয়োজনীয় লিংক</h4>
                  <ul className="space-y-2">
                    <li><button onClick={() => navigateTo('history')} className="hover:text-yellow-400 flex items-center gap-2"><i className="fas fa-chevron-right text-xs"></i> ইতিহাস</button></li>
                    <li><button onClick={() => navigateTo('committee')} className="hover:text-yellow-400 flex items-center gap-2"><i className="fas fa-chevron-right text-xs"></i> কমিটি</button></li>
                    <li><button onClick={() => navigateTo('notice')} className="hover:text-yellow-400 flex items-center gap-2"><i className="fas fa-chevron-right text-xs"></i> নোটিশ বোর্ড</button></li>
                    <li><button onClick={() => navigateTo('donation')} className="hover:text-yellow-400 flex items-center gap-2"><i className="fas fa-chevron-right text-xs"></i> প্রণামী দান করুন</button></li>
                    <li><button onClick={() => navigateTo('admin')} className="hover:text-yellow-400 flex items-center gap-2"><i className="fas fa-cog text-xs"></i> এডমিন লগইন</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">যোগাযোগ</h4>
                  <ul className="space-y-3">
                    <li className="flex items-start gap-3"><i className="fas fa-map-marker-alt text-orange-500 mt-1"></i> <span>গৈলা, আগৈলঝাড়া, বরিশাল, বাংলাদেশ</span></li>
                    <li className="flex items-center gap-3"><i className="fas fa-phone text-orange-500"></i> <span>০১৭১৭৫০৩৬৫৭ (সভাপতি)</span></li>
                    <li className="flex items-center gap-3"><i className="fas fa-envelope text-orange-500"></i> <span>info@manasamondirgoila.com</span></li>
                  </ul>
                </div>
              </div>
              <div className="text-center text-sm text-gray-500 border-t border-gray-800 pt-6">
                <p>© {new Date().getFullYear()} মনসা মন্দির গৈলা। সর্বস্বত্ব সংরক্ষিত।</p>
                <p className="mt-2">Site Developed by: <span className="text-orange-400">SSK Innovation Lab - SSKIL and SoftS</span></p>
              </div>
            </footer>
          );

          // --- Page Views ---
          const Home = () => {
            const [currentImg, setCurrentImg] = useState(0);

            useEffect(() => {
              const timer = setInterval(() => {
                setCurrentImg((prev) => (prev + 1) % galleryImages.length);
              }, 4000);
              return () => clearInterval(timer);
            }, []);

            const nextImg = () => setCurrentImg((prev) => (prev + 1) % galleryImages.length);
            const prevImg = () => setCurrentImg((prev) => (prev === 0 ? galleryImages.length - 1 : prev - 1));

            return (
              <div className="bg-orange-50 min-h-screen">
                {dbError && (
                  <div className="bg-red-600 text-white text-center py-2 text-sm font-bold">
                     ⚠ Database is not connected properly. Showing demo data. (Did you run the SQL script and turn off RLS?)
                  </div>
                )}
              
                {/* Marquee */}
                <div className="bg-orange-800 text-yellow-200 py-2 border-b-2 border-yellow-500">
                  <marquee behavior="scroll" direction="left" className="font-medium text-sm md:text-base">
                    {marqueeText}
                  </marquee>
                </div>

                {/* Hero Section */}
                <section className="relative bg-orange-900 text-white overflow-hidden min-h-[500px] flex items-center">
                  <div className="absolute inset-0 z-0">
                     <div className="absolute inset-0 bg-black/60 z-10"></div>
                     <img src="header image.jpg" alt="Ma Manasa" className="w-full h-full object-cover opacity-80" />
                  </div>
                  
                  <div className="container mx-auto px-4 py-20 relative z-20 text-center">
                    <h1 className="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-500 mb-6 drop-shadow-lg font-serif">
                      শ্রী শ্রী মা মনসা মন্দির
                    </h1>
                    <p className="text-xl md:text-2xl text-orange-100 mb-8 max-w-2xl mx-auto drop-shadow-md">
                      মনসামঙ্গল কাব্যের রচয়িতা কবি বিজয় গুপ্তের প্রতিষ্ঠিত পবিত্র তীর্থস্থান
                    </p>
                    <div className="flex flex-col sm:flex-row gap-4 justify-center">
                      <button onClick={() => navigateTo('history')} className="bg-orange-600 hover:bg-orange-700 text-white px-8 py-3 rounded-full font-bold transition-all shadow-lg border border-orange-500 text-lg">
                        ইতিহাস জানুন
                      </button>
                      <button onClick={() => navigateTo('donation')} className="bg-yellow-500 hover:bg-yellow-400 text-orange-900 px-8 py-3 rounded-full font-bold transition-all shadow-lg text-lg flex items-center justify-center gap-2">
                        <i className="fas fa-heart"></i> প্রণামী দিন
                      </button>
                    </div>
                  </div>
                  
                  <div className="absolute bottom-0 w-full overflow-hidden leading-none z-20">
                    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" className="relative block w-full h-[60px] md:h-[100px]">
                       <polygon points="0,120 1200,120 1200,0 0,120" fill="#fff7ed" />
                    </svg>
                  </div>
                </section>

                {/* Photo Gallery Section */}
                <section className="py-16 container mx-auto px-4">
                  <div className="text-center mb-10">
                    <h2 className="text-3xl md:text-4xl font-bold text-orange-900 mb-4">ফটো গ্যালারি</h2>
                    <div className="h-1 w-24 bg-yellow-500 mx-auto rounded-full"></div>
                  </div>
                  
                  <div className="relative w-full max-w-4xl mx-auto rounded-2xl overflow-hidden shadow-2xl aspect-video bg-gray-900 group">
                     {galleryImages.map((img, index) => (
                        <div key={index} className={`absolute inset-0 w-full h-full transition-opacity duration-1000 flex items-center justify-center text-gray-400 bg-gray-800 ${index === currentImg ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}>
                           <img src={img} alt={`Gallery ${index}`} className="w-full h-full object-cover" />
                        </div>
                     ))}
                     
                     <button onClick={prevImg} className="absolute left-4 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-orange-600 text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-all z-20">
                        <i className="fas fa-chevron-left"></i>
                     </button>
                     <button onClick={nextImg} className="absolute right-4 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-orange-600 text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-all z-20">
                        <i className="fas fa-chevron-right"></i>
                     </button>
                     
                     <div className="absolute bottom-4 left-0 right-0 flex justify-center gap-2 z-20">
                        {galleryImages.map((_, i) => (
                           <div key={i} onClick={() => setCurrentImg(i)} className={`w-3 h-3 rounded-full cursor-pointer transition-all ${i === currentImg ? 'bg-yellow-500 scale-125' : 'bg-white/50'}`}></div>
                        ))}
                     </div>
                  </div>
                </section>

                {/* Famous Devotee Section */}
                <section className="py-16 bg-white border-y border-orange-100">
                  <div className="container mx-auto px-4">
                    <div className="bg-orange-50 rounded-3xl shadow-lg p-8 md:p-12 flex flex-col md:flex-row items-center gap-10 border border-orange-200 relative overflow-hidden">
                      <div className="absolute -right-20 -top-20 w-64 h-64 bg-orange-200 rounded-full opacity-50 blur-3xl"></div>
                      
                      <div className="w-full md:w-1/3 flex justify-center relative z-10">
                        <div className="w-48 h-48 md:w-64 md:h-64 bg-white rounded-full flex items-center justify-center border-4 border-orange-400 shadow-xl overflow-hidden text-orange-300">
                            <i className="fas fa-user-circle text-9xl"></i>
                        </div>
                      </div>

                      </div>

                      <p>
                        কালের বিবর্তনে মন্দিরটি বিভিন্ন সময়ে সংস্কার করা হলেও এর আদি পবিত্রতা ও আধ্যাত্মিক পরিবেশ আজও অম্লান। দেশ-বিদেশের অসংখ্য পুণ্যার্থী তাদের মনোবাসনা পূর্ণ করার জন্য এখানে ছুটে আসেন এবং মায়ের চরণে প্রণামী অর্পণ করেন।
                      </p>
                    </div>
                 </div>
              </div>
            </div>
          );

          // --- Admin Panel ---
          const AdminPanel = () => {
            const [loginPass, setLoginPass] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [activeTab, setActiveTab] = useState('marquee');
            const [successMsg, setSuccessMsg] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            const [newMember, setNewMember] = useState({ name: '', role: '', phone: '', image: null });
            
            // New states for Notice
            const [newNotice, setNewNotice] = useState({ title: '', date: '', text: '' });

            const handleLogin = (e) => {
              e.preventDefault();
              if (loginPass === 'admin123') {
                setIsAdminAuthenticated(true);
                setErrorMsg('');
              } else {
                setErrorMsg('পাসওয়ার্ড সঠিক নয়! (Demo: admin123)');
              }
            };

            const handleLogout = () => {
              setIsAdminAuthenticated(false);
              setLoginPass('');
            };

            const showSuccess = (msg) => {
              setSuccessMsg(msg);
              setTimeout(() => setSuccessMsg(''), 3000);
            };

            const handleImageChange = (e) => {
              const file = e.target.files[0];
              if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                  setNewMember({ ...newMember, image: reader.result });
                };
                reader.readAsDataURL(file);
              }
            };

            const handleMarqueeUpdate = async (e) => {
              e.preventDefault();
              setIsSaving(true);
              
              try {
                  const { error } = await supabaseClient
                    .from('settings')
                    .upsert({ id: 1, key: 'marquee', value: marqueeText });
                    
                  if(error) throw error;
                  showSuccess('স্ক্রলিং টেক্সট আপডেট করা হয়েছে!');
              } catch (err) {
                  setErrorMsg("ডাটাবেসে সেভ করতে সমস্যা হচ্ছে। RLS অফ করা আছে কি?");
                  console.error(err);
              } finally {
                  setIsSaving(false);
              }
            };

            const handleAddMember = async (e) => {
              e.preventDefault();
              if(!newMember.name || !newMember.role) return;
              setIsSaving(true);
              
              const memberToInsert = { 
                  name: newMember.name, 
                  role: newMember.role, 
                  phone: newMember.phone, 
                  image: newMember.image 
              };

              try {
                  const { data, error } = await supabaseClient
                    .from('committee')
                    .insert([memberToInsert])
                    .select();

                  if (error) throw error;
                  
                  if (data) {
                      setCommitteeMembers([...committeeMembers, data[0]]);
                      setNewMember({ name: '', role: '', phone: '', image: null });
                      showSuccess('নতুন সদস্য যুক্ত করা হয়েছে!');
                  }
              } catch (err) {
                  setErrorMsg("Error: RLS Disable করেছেন কি না চেক করুন।");
                  console.error(err);
              } finally {
                  setIsSaving(false);
              }
            };

            const handleDeleteMember = async (id) => {
              if(!confirm('আপনি কি নিশ্চিত যে এই সদস্যকে মুছে ফেলতে চান?')) return;
              setIsSaving(true);
              
              try {
                  const { error } = await supabaseClient
                    .from('committee')
                    .delete()
                    .eq('id', id);
                    
                  if(error) throw error;
                  setCommitteeMembers(committeeMembers.filter(m => m.id !== id));
                  showSuccess('সদস্য মুছে ফেলা হয়েছে!');
              } catch (err) {
                  setErrorMsg("Error deleting.");
              } finally {
                  setIsSaving(false);
              }
            };

            const handleDeleteTestimonial = async (id) => {
                if(!confirm('আপনি কি নিশ্চিত যে এই মতামত মুছে ফেলতে চান?')) return;
                setIsSaving(true);
                
                try {
                    const { error } = await supabaseClient
                        .from('testimonials')
                        .delete()
                        .eq('id', id);
                        
                    if(error) throw error;
                    setTestimonials(testimonials.filter(item => item.id !== id));
                    showSuccess('মতামত মুছে ফেলা হয়েছে!');
                } catch (err) {
                    setErrorMsg("Error deleting testimonial.");
                } finally {
                    setIsSaving(false);
                }
            };
            
            const handleAddNotice = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                try {
                    const { data, error } = await supabaseClient
                        .from('notices')
                        .insert([newNotice])
                        .select();
                        
                    if(error) throw error;
                    if(data) {
                        setNotices([data[0], ...notices]);
                        setNewNotice({ title: '', date: '', text: '' });
                        showSuccess('নোটিশ যোগ করা হয়েছে!');
                    }
                } catch(err) {
                    setErrorMsg("Error adding notice.");
                } finally {
                    setIsSaving(false);
                }
            };
            
            const handleDeleteNotice = async (id) => {
                if(!confirm('নোটিশটি মুছে ফেলতে চান?')) return;
                setIsSaving(true);
                try {
                    const { error } = await supabaseClient.from('notices').delete().eq('id', id);
                    if(error) throw error;
                    setNotices(notices.filter(item => item.id !== id));
                    showSuccess('নোটিশ মুছে ফেলা হয়েছে!');
                } catch(err) {
                    setErrorMsg("Error deleting notice.");
                } finally {
                    setIsSaving(false);
                }
            };

            if (!isAdminAuthenticated) {
              return (
                <div className="bg-gray-100 min-h-screen flex items-center justify-center px-4">
                  <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-orange-600">
                    <div className="text-center mb-8">
                      <i className="fas fa-shield-alt text-orange-600 text-5xl mb-2"></i>
                      <h2 className="text-2xl font-bold text-gray-800">এডমিন লগইন</h2>
                      <p className="text-sm text-gray-500 mt-1">কন্ট্রোল প্যানেলে প্রবেশ করুন</p>
                    </div>
                    {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-center">{errorMsg}</div>}
                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                        <input 
                          type="password" 
                          value={loginPass}
                          onChange={(e) => setLoginPass(e.target.value)}
                          className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none"
                          placeholder="admin123"
                          required
                        />
                      </div>
                      <button type="submit" className="w-full bg-orange-600 text-white font-bold py-2 rounded-lg hover:bg-orange-700 transition-colors">
                        লগইন করুন
                      </button>
                    </form>
                  </div>
                </div>
              );
            }

            return (
              <div className="bg-gray-50 min-h-screen pb-12">
                <div className="bg-gray-900 text-white py-4 px-6 flex justify-between items-center shadow-md">
                   <h2 className="text-xl font-bold flex items-center gap-2"><i className="fas fa-cog text-orange-500"></i> ড্যাশবোর্ড (এডমিন)</h2>
                   <button onClick={handleLogout} className="flex items-center gap-1 text-red-400 hover:text-red-300 font-medium text-sm">
                     <i className="fas fa-sign-out-alt"></i> লগআউট
                   </button>
                </div>

                <div className="container mx-auto px-4 mt-8 flex flex-col md:flex-row gap-6">
                  <div className="w-full md:w-64 flex-shrink-0">
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                      <button onClick={() => setActiveTab('marquee')} className={`px-4 py-3 text-left font-medium border-b ${activeTab === 'marquee' ? 'bg-orange-50 text-orange-700 border-l-4 border-l-orange-600' : 'text-gray-600 hover:bg-gray-50'}`}>
                        মারকুই (Marquee)
                      </button>
                      <button onClick={() => setActiveTab('committee')} className={`px-4 py-3 text-left font-medium border-b ${activeTab === 'committee' ? 'bg-orange-50 text-orange-700 border-l-4 border-l-orange-600' : 'text-gray-600 hover:bg-gray-50'}`}>
                        কমিটি ম্যানেজমেন্ট
                      </button>
                      <button onClick={() => setActiveTab('testimonials')} className={`px-4 py-3 text-left font-medium border-b ${activeTab === 'testimonials' ? 'bg-orange-50 text-orange-700 border-l-4 border-l-orange-600' : 'text-gray-600 hover:bg-gray-50'}`}>
                        মতামত ম্যানেজমেন্ট
                      </button>
                      <button onClick={() => setActiveTab('notices')} className={`px-4 py-3 text-left font-medium ${activeTab === 'notices' ? 'bg-orange-50 text-orange-700 border-l-4 border-l-orange-600' : 'text-gray-600 hover:bg-gray-50'}`}>
                        নোটিশ বোর্ড
                      </button>
                    </div>
                    <div className="mt-4 p-4 bg-blue-50 text-blue-800 rounded-xl text-sm border border-blue-200">
                      <p><strong>Database Status:</strong></p>
                      {dbError ? (
                          <p className="text-red-600 font-bold mt-1">Not Connected / Error Fetching</p>
                      ) : (
                          <p className="text-green-600 font-bold mt-1">Connected Successfully!</p>
                      )}
                    </div>
                  </div>

                  <div className="flex-grow">
                    {successMsg && (
                      <div className="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-center gap-2 shadow-sm">
                        <i className="fas fa-check-circle"></i> {successMsg}
                      </div>
                    )}
                    {errorMsg && (
                      <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-center gap-2 shadow-sm">
                        <i className="fas fa-exclamation-circle"></i> {errorMsg}
                      </div>
                    )}

                    {activeTab === 'marquee' && (
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">হোমপেজের চলমান টেক্সট (Marquee)</h3>
                        <form onSubmit={handleMarqueeUpdate}>
                          <textarea 
                            value={marqueeText}
                            onChange={(e) => setMarqueeText(e.target.value)}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none mb-4 min-h-[100px]"
                          ></textarea>
                          <button type="submit" disabled={isSaving} className="bg-orange-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-orange-700 disabled:opacity-50">
                             {isSaving ? 'সংরক্ষণ করা হচ্ছে...' : 'সংরক্ষণ করুন'}
                          </button>
                        </form>
                      </div>
                    )}

                    {activeTab === 'committee' && (
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">নতুন কমিটি মেম্বার যোগ করুন</h3>
                        <form onSubmit={handleAddMember} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8 bg-gray-50 p-4 rounded-lg border border-gray-100 items-end">
                          <div>
                            <label className="block text-xs font-medium text-gray-500 mb-1">নাম <span className="text-red-500">*</span></label>
                            <input type="text" value={newMember.name} onChange={e=>setNewMember({...newMember, name: e.target.value})} className="w-full px-3 py-2 border rounded-md text-sm" required placeholder="উদা: রহিম উদ্দীন" />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-gray-500 mb-1">পদবী <span className="text-red-500">*</span></label>
                            <input type="text" value={newMember.role} onChange={e=>setNewMember({...newMember, role: e.target.value})} className="w-full px-3 py-2 border rounded-md text-sm" required placeholder="উদা: সদস্য" />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-gray-500 mb-1">ফোন নম্বর</label>
                            <input type="text" value={newMember.phone} onChange={e=>setNewMember({...newMember, phone: e.target.value})} className="w-full px-3 py-2 border rounded-md text-sm" placeholder="উদা: ০১৭১..." />
                          </div>
                          <div>
                            <label className="block text-xs font-medium text-gray-500 mb-1">ছবি (ঐচ্ছিক)</label>
                            <div className="flex gap-2 items-center">
                               <label className="flex-grow cursor-pointer bg-white border border-gray-300 px-3 py-2 rounded-md text-sm hover:bg-gray-50 flex items-center justify-center gap-1 overflow-hidden">
                                 <i className="fas fa-upload text-gray-500"></i>
                                 <span className="text-gray-600 truncate">{newMember.image ? 'ছবি যুক্ত' : 'আপলোড'}</span>
                                 <input type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                               </label>
                               {newMember.image && (
                                 <img src={newMember.image} alt="Preview" className="w-9 h-9 object-cover rounded border border-gray-200 shrink-0" />
                               )}
                            </div>
                          </div>
                          <div className="lg:col-span-4 mt-2">
                             <button type="submit" disabled={isSaving} className="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 flex items-center justify-center gap-2 font-medium disabled:opacity-50">
                                <i className="fas fa-plus"></i> {isSaving ? 'যুক্ত করা হচ্ছে...' : 'সদস্য যুক্ত করুন'}
                             </button>
                          </div>
                        </form>

                        <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">বর্তমান কমিটি ({committeeMembers.length} জন)</h3>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left border-collapse">
                            <thead>
                              <tr className="bg-gray-100 text-gray-600 text-sm">
                                <th className="p-3 border-b">ছবি</th>
                                <th className="p-3 border-b">নাম</th>
                                <th className="p-3 border-b">পদবী</th>
                                <th className="p-3 border-b">ফোন</th>
                                <th className="p-3 border-b text-right">অ্যাকশন</th>
                              </tr>
                            </thead>
                            <tbody>
                              {committeeMembers.map(m => (
                                <tr key={m.id} className="border-b hover:bg-gray-50 text-sm">
                                  <td className="p-3">
                                     {m.image ? (
                                       <img src={m.image} alt={m.name} className="w-10 h-10 rounded-full object-cover border border-gray-200" />
                                     ) : (
                                       <div className="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-400">
                                         <i className="fas fa-user"></i>
                                       </div>
                                     )}
                                  </td>
                                  <td className="p-3 font-medium text-gray-800">{m.name}</td>
                                  <td className="p-3 text-orange-600">{m.role}</td>
                                  <td className="p-3 text-gray-500">{m.phone || '-'}</td>
                                  <td className="p-3 text-right">
                                    <button onClick={() => handleDeleteMember(m.id)} className="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-md">
                                      <i className="fas fa-trash"></i>
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {activeTab === 'testimonials' && (
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                           <h3 className="text-lg font-bold text-gray-800">মতামত ম্যানেজমেন্ট</h3>
                           <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">Total: {testimonials.length}</span>
                        </div>
                        <div className="space-y-4">
                          {testimonials.map(t => (
                            <div key={t.id} className="border rounded-lg p-4 bg-gray-50 flex justify-between items-start">
                              <div>
                                <p className="font-bold text-sm text-gray-800">{t.name} <span className="text-gray-400 font-normal">({t.date})</span></p>
                                <p className="text-xs text-orange-600 mb-2">{t.designation}</p>
                                <p className="text-sm text-gray-600 italic">"{t.text}"</p>
                              </div>
                              <button onClick={() => handleDeleteTestimonial(t.id)} disabled={isSaving} className="text-red-500 hover:bg-red-100 p-2 rounded shrink-0 disabled:opacity-50">
                                 <i className="fas fa-trash"></i>
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {activeTab === 'notices' && (
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">নতুন নোটিশ যোগ করুন</h3>
                        <form onSubmit={handleAddNotice} className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 bg-gray-50 p-4 rounded-lg border border-gray-100 items-end">
                            <div>
                                <label className="block text-xs font-medium text-gray-500 mb-1">শিরোনাম <span className="text-red-500">*</span></label>
                                <input type="text" value={newNotice.title} onChange={e=>setNewNotice({...newNotice, title: e.target.value})} className="w-full px-3 py-2 border rounded-md text-sm" required placeholder="উদা: নতুন কমিটি গঠন" />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-500 mb-1">তারিখ</label>
                                <input type="text" value={newNotice.date} onChange={e=>setNewNotice({...newNotice, date: e.target.value})} className="w-full px-3 py-2 border rounded-md text-sm" placeholder="উদা: ১৫ মার্চ, ২০২৪" />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-xs font-medium text-gray-500 mb-1">নোটিশের বিবরণ</label>
                                <textarea value={newNotice.text} onChange={e=>setNewNotice({...newNotice, text: e.target.value})} className="w-full px-3 py-2 border rounded-md text-sm" placeholder="বিস্তারিত লিখুন..."></textarea>
                            </div>
                            <div className="md:col-span-2 mt-2">
                             <button type="submit" disabled={isSaving} className="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 flex items-center justify-center gap-2 font-medium disabled:opacity-50">
                                <i className="fas fa-plus"></i> {isSaving ? 'যুক্ত করা হচ্ছে...' : 'নোটিশ যুক্ত করুন'}
                             </button>
                          </div>
                        </form>
                        
                        <div className="space-y-4 mt-6">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">বর্তমান নোটিশসমূহ</h3>
                            {notices.map(n => (
                                <div key={n.id} className="border rounded-lg p-4 bg-gray-50 flex justify-between items-start">
                                  <div>
                                    <p className="font-bold text-sm text-gray-800">{n.title} <span className="text-gray-400 font-normal text-xs ml-2 bg-white px-2 rounded">({n.date})</span></p>
                                    <p className="text-sm text-gray-600 mt-1">{n.text}</p>
                                  </div>
                                  <button onClick={() => handleDeleteNotice(n.id)} disabled={isSaving} className="text-red-500 hover:bg-red-100 p-2 rounded shrink-0 disabled:opacity-50">
                                     <i className="fas fa-trash"></i>
                                  </button>
                                </div>
                            ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          };

          const renderPage = () => {
            switch (currentPage) {
              case 'home': return <Home />;
              case 'committee': return <CommitteePage />;
              case 'testimonials': return <TestimonialsPage />;
              case 'donation': return <DonationPage />;
              case 'history': return <HistoryPage />;
              case 'event': return <EventsPage />;
              case 'notice': return <NoticeBoardPage />;
              case 'admin': return <AdminPanel />;
              default: return <Home />;
            }
          };

          return (
            <div className="font-sans text-gray-900 selection:bg-yellow-300 selection:text-orange-900">
              {currentPage !== 'admin' && <Header />}
              <main className="min-h-screen bg-white">
                {isLoading && currentPage === 'home' ? (
                   <div className="flex items-center justify-center h-screen">
                      <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-orange-600"></div>
                   </div>
                ) : (
                   renderPage()
                )}
              </main>
              {currentPage !== 'admin' && <Footer />}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
