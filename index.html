        // --- Helper Functions ---
        const englishToBengaliNumber = (engStr) => {
            if (!engStr) return '';
            const benDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            return engStr.toString().replace(/\d/g, d => benDigits[d]);
        };

        const formatDateToBengali = (dateStr) => {
            if (!dateStr) return '';
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return englishToBengaliNumber(dateStr); 
            const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const [y, m, d] = dateStr.split('-');
            const day = englishToBengaliNumber(parseInt(d, 10));
            const year = englishToBengaliNumber(y);
            const month = months[parseInt(m, 10) - 1];
            return `${day} ${month}, ${year}`;
        };

        const shareEvent = async (ev, showToast) => {

                url: window.location.origin + window.location.pathname + '#event'
            };
            
            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`);
                    showToast('ইভেন্টের তথ্য কপি করা হয়েছে!');

                      <p><strong className="text-gray-900">একাউন্ট নম্বর:</strong> ০১৩৪-XXXX-XXXX-XXXX</p>
                      <p><strong className="text-gray-900">ব্যাংক:</strong> সোনালী ব্যাংক লিমিটেড</p>

                  <div className="bg-white p-8 rounded-2xl shadow-lg border-t-[6px] border-yellow-500">
                     <h3 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2 border-b pb-4">
                       <i className="fas fa-mobile-alt text-yellow-600"></i> মোবাইল ব্যাংকিং

                    <div className="space-y-6">
                      <div className="flex items-center gap-5 bg-pink-50 p-5 rounded-xl border border-pink-200 shadow-sm">
                        <div className="w-14 h-14 bg-pink-600 text-white font-bold rounded-xl flex items-center justify-center text-sm shadow-md">bKash</div>
                        <div>

                      <div className="flex items-center gap-5 bg-orange-50 p-5 rounded-xl border border-orange-200 shadow-sm">

                <div className="bg-gradient-to-r from-orange-800 to-orange-900 text-white p-8 rounded-2xl text-center shadow-xl border border-orange-700">
                   <p className="text-xl italic font-medium">"দানবীর্যের প্রভাবে ইহকাল ও পরকালে শান্তি মেলে। মা মনসা আপনার সহায় হোন।"</p>

        };

        const HistoryPage = ({ navigateTo }) => (
          <div className="bg-orange-50 min-h-screen py-12">
            <div className="container mx-auto px-4 max-w-4xl">
               <BackButton navigateTo={navigateTo} />
               <div className="bg-white p-8 md:p-14 rounded-3xl shadow-xl border border-orange-100">
                  <h1 className="text-4xl md:text-5xl font-bold text-orange-900 mb-8 text-center border-b-2 border-yellow-500 pb-4 font-serif">ইতিহাস ও ঐতিহ্য</h1>
                  
                  <div className="text-gray-700 text-justify leading-loose text-lg space-y-6">
                    <p>
                      মধ্যযুগের অন্যতম শ্রেষ্ঠ বাঙালি কবি বিজয় গুপ্ত। তিনি বরিশাল জেলার আগৈলঝাড়া উপজেলার গৈলা (তকালীন ফুল্লশ্রী) গ্রামে জন্মগ্রহণ করেন। তাঁর রচিত "পদ্মাপুরাণ" বা "মনসামঙ্গল" কাব্য বাংলা সাহিত্যের এক অমূল্য সম্পদ।
                    </p>
                    
                    <p>
                      কিংবদন্তি ও ইতিহাস অনুযায়ী, কবি বিজয় গুপ্ত স্বয়ং দেবী মনসার স্বপ্নাদিষ্ট হয়ে এই স্থানে মনসা মন্দির প্রতিষ্ঠা করেছিলেন। পঞ্চদশ শতাব্দীতে প্রতিষ্ঠিত এই মন্দিরটি শুধু একটি উপাসনালয় নয়, বরং বাঙালির প্রাচীন সংস্কৃতির এক জীবন্ত সাক্ষী।
                    </p>

                    <div className="bg-orange-50 p-8 rounded-2xl border-l-[6px] border-orange-500 my-10 shadow-sm">
                      <h3 className="text-2xl font-bold text-orange-900 mb-3 font-serif flex items-center gap-2"><i className="fas fa-om text-orange-500"></i> পদ্মাপুরাণ ও রয়ানী গান</h3>
                      <p className="text-gray-800 leading-relaxed">
                        প্রতি বছর শ্রাবণ মাসে এই মন্দিরে বিশেষ উৎসবের আয়োজন করা হয়। তখন ঐতিহ্যবাহী 'রয়ানী গান' (মনসামঙ্গল কাব্যের গীত) পরিবেশিত হয়, যা দেশের বিভিন্ন প্রান্ত থেকে আগত ভক্ত ও গবেষকদের আকর্ষণ করে।
                      </p>
                    </div>

                    <p>
                      কালের বিবর্তনে মন্দিরটি বিভিন্ন সময়ে সংস্কার করা হলেও এর আদি পবিত্রতা ও আধ্যাত্মিক পরিবেশ আজও অম্লান। দেশ-বিদেশের অসংখ্য পুণ্যার্থী আপন মনোবাসনা পূর্ণ করার জন্য এখানে ছুটে আসেন এবং মায়ের চরণে প্রণামী অর্পণ করেন।
                    </p>
                  </div>
               </div>
            </div>
          </div>
        );

        // --- Admin Panel ---
        const AdminPanel = ({ 
            supabaseClient, dbError, navigateTo,
            isAdminAuthenticated, setIsAdminAuthenticated,
            marqueeText, setMarqueeText,
            committeeMembers, setCommitteeMembers,
            testimonials, setTestimonials,
            events, setEvents,
            notices, setNotices,
            donations, setDonations,
            featuredTestimonialIds, setFeaturedTestimonialIds,
            showToast
        }) => {
          const [loginEmail, setLoginEmail] = useState('');
          const [loginPass, setLoginPass] = useState('');
          const [errorMsg, setErrorMsg] = useState('');
          const [activeTab, setActiveTab] = useState('marquee');
          const [isSaving, setIsSaving] = useState(false);

          // Edit States
          const [editingCommitteeId, setEditingCommitteeId] = useState(null);
          const [editingTestimonialId, setEditingTestimonialId] = useState(null);
          const [editingNoticeId, setEditingNoticeId] = useState(null);
          const [editingEventId, setEditingEventId] = useState(null);
          const [editingDonationId, setEditingDonationId] = useState(null);

          // Form States
          const [newMember, setNewMember] = useState({ name: '', role: '', phone: '', image: null });
          const [newTestimonial, setNewTestimonial] = useState({ name: '', designation: '', text: '', date: '' });
          const [newNotice, setNewNotice] = useState({ title: '', date: '', text: '' });
          const [newEvent, setNewEvent] = useState({ title: '', date: '', description: '', image: null });
          const [newDonation, setNewDonation] = useState({ name: '', address: '', type: 'নগদ অর্থ', amount: '', date: '', is_hidden: false });

          const handleLogin = async (e) => {
            e.preventDefault();
            setIsSaving(true);
            setErrorMsg('');
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: loginEmail,
              password: loginPass,
            });

            setIsSaving(false);

            if (error) {
              setErrorMsg('ইমেইল বা পাসওয়ার্ড সঠিক নয়!');
            } else if (data.session) {
              setIsAdminAuthenticated(true);
            }
          };

          const handleLogout = async () => {
            await supabaseClient.auth.signOut();
            setIsAdminAuthenticated(false);
            setLoginEmail('');
            setLoginPass('');
          };

          const handleImageChange = (e, setFunc, stateVar) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                setFunc({ ...stateVar, image: reader.result });
              };
              reader.readAsDataURL(file);
            }
          };

          // -- Marquee --
          const handleMarqueeUpdate = async (e) => {
            e.preventDefault();
            setIsSaving(true);
            try {
                const { error } = await supabaseClient.from('settings').upsert({ id: 1, key: 'marquee', value: marqueeText });
                if(error) throw error;
                showToast('স্ক্রলিং টেক্সট আপডেট করা হয়েছে!');
            } catch (err) {
                setErrorMsg("আপডেট করতে সমস্যা হচ্ছে।");
            } finally {
                setIsSaving(false);
            }
          };

          // -- Committee --
          const handleSaveMember = async (e) => {
            e.preventDefault();
            if(!newMember.name || !newMember.role) return;
            setIsSaving(true);
            
            const memberData = { 
                name: newMember.name, 
                role: newMember.role, 
                phone: newMember.phone, 
                image: newMember.image 
            };

            try {
                if(editingCommitteeId) {
                    const { error } = await supabaseClient.from('committee').update(memberData).eq('id', editingCommitteeId);
                    if (error) throw error;
                    
                    setCommitteeMembers(committeeMembers.map(m => m.id === editingCommitteeId ? { ...m, ...memberData } : m));
                    showToast('সদস্যের তথ্য আপডেট করা হয়েছে!');
                    setEditingCommitteeId(null);
                } else {
                    memberData.order_idx = committeeMembers.length;
                    const { data, error } = await supabaseClient.from('committee').insert([memberData]).select();
                    if (error) throw error;
                    if (data) {
                        setCommitteeMembers([...committeeMembers, data[0]]);
                        showToast('নতুন সদস্য যুক্ত করা হয়েছে!');
                    }
                }
                setNewMember({ name: '', role: '', phone: '', image: null });
            } catch (err) {
                setErrorMsg("Error saving data.");
            } finally {
                setIsSaving(false);
            }
          };

          const handleDeleteMember = async (id) => {
            if(!confirm('আপনি কি নিশ্চিত যে এই সদস্যকে মুছে ফেলতে চান?')) return;
            setIsSaving(true);
            try {
                const { error } = await supabaseClient.from('committee').delete().eq('id', id);
                if(error) throw error;
                setCommitteeMembers(committeeMembers.filter(m => m.id !== id));
                showToast('সদস্য মুছে ফেলা হয়েছে!');
            } catch (err) {
                setErrorMsg("Error deleting.");
            } finally {
                setIsSaving(false);
            }
          };

          const handleMoveCommittee = async (index, direction) => {
              if (direction === 'up' && index === 0) return;
              if (direction === 'down' && index === committeeMembers.length - 1) return;

              const newMembers = [...committeeMembers];
              const swapIndex = direction === 'up' ? index - 1 : index + 1;
              const temp = newMembers[index];
              newMembers[index] = newMembers[swapIndex];
              newMembers[swapIndex] = temp;

              const updatedMembers = newMembers.map((m, i) => ({ ...m, order_idx: i }));
              setCommitteeMembers(updatedMembers); 

              setIsSaving(true);
              try {
                  const updates = updatedMembers.map(m => ({
                      id: m.id, name: m.name, role: m.role, phone: m.phone, image: m.image, order_idx: m.order_idx
                  }));
                  await supabaseClient.from('committee').upsert(updates);
                  showToast('অর্ডার সেভ হয়েছে!');
              } catch (e) {
                  setErrorMsg("Order save failed.");
              }
              setIsSaving(false);
          };

          // -- Testimonials --
          const handleSaveTestimonial = async (e) => {
              e.preventDefault();
              setIsSaving(true);
              try {
                  if (editingTestimonialId) {
                      const { error } = await supabaseClient.from('testimonials').update(newTestimonial).eq('id', editingTestimonialId);
                      if(error) throw error;
                      
                      let updatedList = testimonials.map(t => t.id === editingTestimonialId ? { ...t, ...newTestimonial } : t);
                      updatedList.sort((a,b) => new Date(b.date) - new Date(a.date));
                      setTestimonials(updatedList);
                      showToast('মতামত আপডেট করা হয়েছে!');
                      setEditingTestimonialId(null);
                  } else {
                      const { data, error } = await supabaseClient.from('testimonials').insert([newTestimonial]).select();
                      if(error) throw error;
                      if(data) {
                          let updatedList = [data[0], ...testimonials];
                          updatedList.sort((a,b) => new Date(b.date) - new Date(a.date));
                          setTestimonials(updatedList);
                          showToast('নতুন মতামত যোগ করা হয়েছে!');
                      }
                  }
                  setNewTestimonial({ name: '', designation: '', text: '', date: '' });
              } catch(err) {
                  setErrorMsg("Error saving testimonial.");
              } finally {
                  setIsSaving(false);
              }
          };

          const handleDeleteTestimonial = async (id) => {
              if(!confirm('আপনি কি নিশ্চিত যে এই মতামত মুছে ফেলতে চান?')) return;
              setIsSaving(true);
              try {
                  const { error } = await supabaseClient.from('testimonials').delete().eq('id', id);
                  if(error) throw error;
                  setTestimonials(testimonials.filter(item => item.id !== id));
                  
                  if (featuredTestimonialIds.includes(id)) {
                      const updatedIds = featuredTestimonialIds.filter(x => x !== id);
                      setFeaturedTestimonialIds(updatedIds);
                      const { data: existing } = await supabaseClient.from('settings').select('id').eq('key', 'featured_test_ids').maybeSingle();
                      if(existing) await supabaseClient.from('settings').update({ value: JSON.stringify(updatedIds) }).eq('id', existing.id);
                  }
                  
                  showToast('মতামত মুছে ফেলা হয়েছে!');
              } catch (err) {
                  setErrorMsg("Error deleting testimonial.");
              } finally {
                  setIsSaving(false);
              }
          };
          
          const handleToggleFeaturedTestimonial = async (id) => {
              setIsSaving(true);
              try {
                  let updatedIds = [...featuredTestimonialIds];
                  if (updatedIds.includes(id)) {
                      updatedIds = updatedIds.filter(x => x !== id);
                  } else {
                      updatedIds.push(id);
                  }
                  
                  const { data: existing } = await supabaseClient.from('settings').select('id').eq('key', 'featured_test_ids').maybeSingle();
                  if (existing) {
                      await supabaseClient.from('settings').update({ value: JSON.stringify(updatedIds) }).eq('id', existing.id);
                  } else {
                      await supabaseClient.from('settings').insert({ key: 'featured_test_ids', value: JSON.stringify(updatedIds) });
                  }
                  
                  setFeaturedTestimonialIds(updatedIds);
                  showToast('হোমপেজ ফিচার্ড লিস্ট আপডেট হয়েছে!');
              } catch (err) {
                  setErrorMsg("আপডেট করতে সমস্যা হচ্ছে।");
              } finally {
                  setIsSaving(false);
              }
          };
          
          // -- Notices --
          const handleSaveNotice = async (e) => {
              e.preventDefault();
              setIsSaving(true);
              try {
                  if (editingNoticeId) {
                      const { error } = await supabaseClient.from('notices').update(newNotice).eq('id', editingNoticeId);
                      if(error) throw error;
                      
                      let updatedNotices = notices.map(n => n.id === editingNoticeId ? { ...n, ...newNotice } : n);
                      updatedNotices.sort((a, b) => new Date(b.date) - new Date(a.date));
                      setNotices(updatedNotices);
                      showToast('নোটিশ আপডেট করা হয়েছে!');
                      setEditingNoticeId(null);
                  } else {
                      const { data, error } = await supabaseClient.from('notices').insert([newNotice]).select();
                      if(error) throw error;
                      if(data) {
                          let updatedNotices = [data[0], ...notices];
                          updatedNotices.sort((a, b) => new Date(b.date) - new Date(a.date));
                          setNotices(updatedNotices);
                          showToast('নোটিশ যোগ করা হয়েছে!');
                      }
                  }
                  setNewNotice({ title: '', date: '', text: '' });
              } catch(err) {
                  setErrorMsg("Error saving notice.");
              } finally {
                  setIsSaving(false);
              }
          };
          
          const handleDeleteNotice = async (id) => {
              if(!confirm('নোটিশটি মুছে ফেলতে চান?')) return;
              setIsSaving(true);
              try {
                  const { error } = await supabaseClient.from('notices').delete().eq('id', id);
                  if(error) throw error;
                  setNotices(notices.filter(item => item.id !== id));
                  showToast('নোটিশ মুছে ফেলা হয়েছে!');
              } catch(err) {
                  setErrorMsg("Error deleting notice.");
              } finally {
                  setIsSaving(false);
              }
          };

          // -- Events --
          const handleSaveEvent = async (e) => {
              e.preventDefault();
              setIsSaving(true);
              try {
                  if (editingEventId) {
                      const { error } = await supabaseClient.from('events').update(newEvent).eq('id', editingEventId);
                      if(error) throw error;
                      
                      let updatedEvents = events.map(ev => ev.id === editingEventId ? { ...ev, ...newEvent } : ev);
                      updatedEvents.sort((a, b) => new Date(b.date) - new Date(a.date));
                      setEvents(updatedEvents);
                      showToast('ইভেন্ট আপডেট করা হয়েছে!');
                      setEditingEventId(null);
                  } else {
                      const { data, error } = await supabaseClient.from('events').insert([newEvent]).select();
                      if(error) throw error;
                      if(data) {
                          let updatedEvents = [data[0], ...events];
                          updatedEvents.sort((a, b) => new Date(b.date) - new Date(a.date));
                          setEvents(updatedEvents);
                          showToast('নতুন ইভেন্ট যোগ করা হয়েছে!');
                      }
                  }
                  setNewEvent({ title: '', date: '', description: '', image: null });
              } catch(err) {
                  setErrorMsg("Error saving event. SQL Error? Did you run the ALTER TABLE command for event images?");
              } finally {
                  setIsSaving(false);
              }
          };
          
          const handleDeleteEvent = async (id) => {
              if(!confirm('ইভেন্টটি মুছে ফেলতে চান?')) return;
              setIsSaving(true);
              try {
                  const { error } = await supabaseClient.from('events').delete().eq('id', id);
                  if(error) throw error;
                  setEvents(events.filter(item => item.id !== id));
                  showToast('ইভেন্ট মুছে ফেলা হয়েছে!');
              } catch(err) {
                  setErrorMsg("Error deleting event.");
              } finally {
                  setIsSaving(false);
              }
          };

          // -- Donations --
          const handleSaveDonation = async (e) => {
              e.preventDefault();
              setIsSaving(true);
              try {
                  if (editingDonationId) {
                      const { error } = await supabaseClient.from('donations').update(newDonation).eq('id', editingDonationId);
                      if(error) throw error;
                      
                      let updatedD = donations.map(d => d.id === editingDonationId ? { ...d, ...newDonation } : d);
                      updatedD.sort((a, b) => b.id - a.id);
                      setDonations(updatedD);
                      showToast('অনুদান আপডেট করা হয়েছে!');
                      setEditingDonationId(null);
                  } else {
                      const { data, error } = await supabaseClient.from('donations').insert([newDonation]).select();
                      if(error) throw error;
                      if(data) {
                          let updatedD = [data[0], ...donations];
                          updatedD.sort((a, b) => b.id - a.id);
                          setDonations(updatedD);
                          showToast('নতুন অনুদান যোগ করা হয়েছে!');
                      }
                  }
                  setNewDonation({ name: '', address: '', type: 'নগদ অর্থ', amount: '', date: '', is_hidden: false });
              } catch(err) {
                  setErrorMsg("Error saving donation. Did you run the SQL to create donations table?");
              } finally {
                  setIsSaving(false);
              }
          };

          const handleDeleteDonation = async (id) => {
              if(!confirm('অনুদানটি মুছে ফেলতে চান?')) return;
              setIsSaving(true);
              try {
                  const { error } = await supabaseClient.from('donations').delete().eq('id', id);
                  if(error) throw error;
                  setDonations(donations.filter(item => item.id !== id));
                  showToast('অনুদান মুছে ফেলা হয়েছে!');
              } catch(err) {
                  setErrorMsg("Error deleting donation.");
              } finally {
                  setIsSaving(false);
              }
          };

          const handleToggleDonationVisibility = async (id, currentStatus) => {
              setIsSaving(true);
              try {
                  const { error } = await supabaseClient.from('donations').update({ is_hidden: !currentStatus }).eq('id', id);
                  if(error) throw error;
                  setDonations(donations.map(d => d.id === id ? { ...d, is_hidden: !currentStatus } : d));
                  showToast(currentStatus ? 'পাবলিক করা হয়েছে!' : 'হাইড করা হয়েছে!');
              } catch(err) {
                  setErrorMsg("Error updating visibility.");
              } finally {
                  setIsSaving(false);
              }
          };

          if (!isAdminAuthenticated) {
            return (
              <div className="bg-gray-100 min-h-screen flex items-center justify-center px-4 relative">
                <div className="absolute inset-0 bg-orange-900/10 z-0"></div>
                <div className="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-[8px] border-orange-600 relative z-10">
                  <div className="text-center mb-8">
                    <div className="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4 border border-orange-200">
                       <i className="fas fa-shield-alt text-orange-600 text-4xl"></i>
                    </div>
                    <h2 className="text-2xl font-bold text-gray-800">এডমিন প্যানেল</h2>
                    <p className="text-sm text-gray-500 mt-1">অ্যাক্সেস করতে লগইন করুন</p>
                  </div>
                  {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded mb-4 text-sm text-center border border-red-100 font-medium">{errorMsg}</div>}
                  
                  <form onSubmit={handleLogin} className="space-y-5">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">ইমেইল (Email)</label>
                      <input 
                        type="email" 
                        value={loginEmail}
                        onChange={(e) => setLoginEmail(e.target.value)}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none bg-gray-50"
                        placeholder="admin@example.com"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">পাসওয়ার্ড (Password)</label>
                      <input 
                        type="password" 
                        value={loginPass}
                        onChange={(e) => setLoginPass(e.target.value)}
                        className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none bg-gray-50"
                        placeholder="******"
                        required
                      />
                    </div>
                    <button type="submit" disabled={isSaving} className="w-full bg-gradient-to-r from-orange-600 to-orange-500 text-white font-bold py-3 rounded-xl hover:from-orange-700 hover:to-orange-600 transition-all disabled:opacity-50 shadow-md">
                      {isSaving ? <span className="flex items-center justify-center gap-2"><i className="fas fa-spinner fa-spin"></i> লগইন হচ্ছে...</span> : 'লগইন করুন'}
                    </button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div className="bg-gray-50 min-h-screen pb-12 relative">

              <div className="bg-gray-900 text-white py-4 px-6 flex justify-between items-center shadow-md sticky top-0 z-40 border-b-4 border-orange-500">
                 <h2 className="text-xl font-bold flex items-center gap-2"><i className="fas fa-user-shield text-orange-400"></i> ড্যাশবোর্ড (এডমিন)</h2>
                 <div className="flex gap-4 items-center">
                   <button onClick={() => navigateTo('home')} className="text-gray-300 hover:text-white font-medium text-sm flex items-center gap-1 transition-colors">
                     <i className="fas fa-home"></i> হোমপেজ
                   </button>
                   <button onClick={handleLogout} className="bg-red-600/20 text-red-400 px-4 py-1.5 rounded-lg flex items-center gap-2 hover:bg-red-600/40 hover:text-white font-medium text-sm transition-colors border border-red-500/30">
                     <i className="fas fa-sign-out-alt"></i> লগআউট
                   </button>
                 </div>
              </div>

              <div className="container mx-auto px-4 mt-8 flex flex-col md:flex-row gap-6">
                <div className="w-full md:w-64 flex-shrink-0">
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col sticky top-24">
                    <button onClick={() => setActiveTab('marquee')} className={`px-5 py-3.5 text-left font-bold text-sm border-b ${activeTab === 'marquee' ? 'bg-orange-50 text-orange-700 border-l-[5px] border-l-orange-600' : 'text-gray-600 hover:bg-gray-50 border-l-[5px] border-transparent'}`}>
                      <i className="fas fa-text-width w-5"></i> স্ক্রলিং টেক্সট
                    </button>
                    <button onClick={() => setActiveTab('committee')} className={`px-5 py-3.5 text-left font-bold text-sm border-b ${activeTab === 'committee' ? 'bg-orange-50 text-orange-700 border-l-[5px] border-l-orange-600' : 'text-gray-600 hover:bg-gray-50 border-l-[5px] border-transparent'}`}>
                      <i className="fas fa-users w-5"></i> কমিটি ম্যানেজমেন্ট
                    </button>
                    <button onClick={() => setActiveTab('testimonials')} className={`px-5 py-3.5 text-left font-bold text-sm border-b ${activeTab === 'testimonials' ? 'bg-orange-50 text-orange-700 border-l-[5px] border-l-orange-600' : 'text-gray-600 hover:bg-gray-50 border-l-[5px] border-transparent'}`}>
                      <i className="fas fa-comments w-5"></i> মতামত ম্যানেজমেন্ট
                    </button>
                    <button onClick={() => setActiveTab('notices')} className={`px-5 py-3.5 text-left font-bold text-sm border-b ${activeTab === 'notices' ? 'bg-orange-50 text-orange-700 border-l-[5px] border-l-orange-600' : 'text-gray-600 hover:bg-gray-50 border-l-[5px] border-transparent'}`}>
                      <i className="fas fa-bullhorn w-5"></i> নোটিশ বোর্ড
                    </button>
                    <button onClick={() => setActiveTab('events')} className={`px-5 py-3.5 text-left font-bold text-sm border-b ${activeTab === 'events' ? 'bg-orange-50 text-orange-700 border-l-[5px] border-l-orange-600' : 'text-gray-600 hover:bg-gray-50 border-l-[5px] border-transparent'}`}>
                      <i className="fas fa-calendar-alt w-5"></i> ইভেন্ট ম্যানেজমেন্ট
                    </button>
                    <button onClick={() => setActiveTab('donations')} className={`px-5 py-3.5 text-left font-bold text-sm ${activeTab === 'donations' ? 'bg-orange-50 text-orange-700 border-l-[5px] border-l-orange-600' : 'text-gray-600 hover:bg-gray-50 border-l-[5px] border-transparent'}`}>
                      <i className="fas fa-hand-holding-usd w-5"></i> অনুদান ম্যানেজমেন্ট
                    </button>
                  </div>
                  <div className="mt-6 p-5 bg-green-50 text-green-800 rounded-2xl text-sm border border-green-200 shadow-sm flex items-start gap-3">
                    <i className="fas fa-check-circle mt-1 text-green-600"></i>
                    <div>
                       <p className="font-bold mb-1">সিস্টেম স্ট্যাটাস</p>
                       {dbError ? <p className="text-red-600">Database Error!</p> : <p>Connected to Database</p>}
                    </div>
                  </div>
                </div>

                <div className="flex-grow">
                  {errorMsg && (
                    <div className="mb-4 bg-red-100 border border-red-300 text-red-800 px-5 py-3 rounded-xl flex items-center gap-3 shadow-sm font-medium">
                      <i className="fas fa-exclamation-circle text-lg"></i> {errorMsg}
                    </div>
                  )}

                  {activeTab === 'marquee' && (
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                      <h3 className="text-xl font-bold text-gray-800 mb-6 border-b pb-3 flex items-center gap-2"><i className="fas fa-pen text-orange-500"></i> হোমপেজের চলমান টেক্সট (Marquee)</h3>
                      <form onSubmit={handleMarqueeUpdate}>
                        <textarea 
                          value={marqueeText}
                          onChange={(e) => setMarqueeText(e.target.value)}
                          className="w-full px-5 py-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none mb-6 min-h-[120px] text-lg bg-gray-50"
                        ></textarea>
                        <button type="submit" disabled={isSaving} className="bg-orange-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-700 disabled:opacity-50 shadow-md">
                           <i className="fas fa-save mr-2"></i> {isSaving ? 'সংরক্ষণ করা হচ্ছে...' : 'সংরক্ষণ করুন'}
                        </button>
                      </form>
                    </div>
                  )}

                  {activeTab === 'committee' && (
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                      <h3 className="text-xl font-bold text-gray-800 mb-6 border-b pb-3 flex items-center gap-2"><i className="fas fa-user-plus text-orange-500"></i> {editingCommitteeId ? 'সদস্য আপডেট করুন' : 'নতুন সদস্য যোগ করুন'}</h3>
                      <form onSubmit={handleSaveMember} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-10 bg-gray-50 p-6 rounded-2xl border border-gray-200 items-end shadow-inner">
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-1">নাম <span className="text-red-500">*</span></label>
                          <input type="text" value={newMember.name} onChange={e=>setNewMember({...newMember, name: e.target.value})} className="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-orange-500" required placeholder="উদা: রহিম উদ্দীন" />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-1">পদবী <span className="text-red-500">*</span></label>
                          <input type="text" value={newMember.role} onChange={e=>setNewMember({...newMember, role: e.target.value})} className="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-orange-500" required placeholder="উদা: সদস্য" />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-1">ফোন নম্বর</label>
                          <input type="text" value={newMember.phone} onChange={e=>setNewMember({...newMember, phone: e.target.value})} className="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-orange-500" placeholder="উদা: ০১৭১..." />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-gray-700 mb-1">ছবি (ঐচ্ছিক)</label>
                          <div className="flex gap-2 items-center">
                             <label className="flex-grow cursor-pointer bg-white border border-gray-300 px-4 py-2.5 rounded-xl text-sm hover:bg-gray-50 flex items-center justify-center gap-2 overflow-hidden shadow-sm">
                               <i className="fas fa-image text-gray-500"></i>
                               <span className="text-gray-600 truncate font-medium">{newMember.image ? 'ছবি যুক্ত' : 'আপলোড করুন'}</span>
                               <input type="file" accept="image/*" onChange={(e) => handleImageChange(e, setNewMember, newMember)} className="hidden" />
                             </label>
                             {newMember.image && (
                               <img src={newMember.image} alt="Preview" className="w-10 h-10 object-cover rounded-lg border border-gray-300 shadow-sm shrink-0" />
                             )}
                          </div>
                        </div>
                        <div className="lg:col-span-4 mt-2 flex gap-3">
                           <button type="submit" disabled={isSaving} className="w-full bg-green-600 text-white px-6 py-3 rounded-xl hover:bg-green-700 flex items-center justify-center gap-2 font-bold disabled:opacity-50 shadow-md">
                              <i className={editingCommitteeId ? "fas fa-save" : "fas fa-plus"}></i> {isSaving ? 'সেভ হচ্ছে...' : (editingCommitteeId ? 'আপডেট করুন' : 'সদস্য যুক্ত করুন')}
                           </button>
                           {editingCommitteeId && (
                              <button type="button" onClick={() => { setEditingCommitteeId(null); setNewMember({name:'', role:'', phone:'', image:null}); }} className="bg-gray-500 text-white px-6 py-3 rounded-xl hover:bg-gray-600 font-bold shadow-md">বাতিল</button>
                           )}
                        </div>
                      </form>

                      <h3 className="text-xl font-bold text-gray-800 mb-4 border-b pb-3 flex items-center justify-between">
                          <span><i className="fas fa-list text-orange-500 mr-2"></i> বর্তমান কমিটি লিস্ট</span>
                          <span className="bg-blue-100 text-blue-800 text-sm px-3 py-1 rounded-full">{committeeMembers.length} জন</span>
                      </h3>
                      <div className="overflow-x-auto rounded-xl border border-gray-200">
                        <table className="w-full text-left border-collapse bg-white">
                          <thead>
                            <tr className="bg-gray-100 text-gray-700 text-sm border-b">
                              <th className="p-4 w-20 text-center">অর্ডার</th>
                              <th className="p-4 w-16">ছবি</th>
                              <th className="p-4 font-bold">নাম</th>
                              <th className="p-4 font-bold">পদবী</th>
                              <th className="p-4 text-center font-bold">অ্যাকশন</th>
                            </tr>
                          </thead>
                          <tbody>
                            {committeeMembers.map((m, idx) => (
                              <tr key={m.id} className="border-b hover:bg-orange-50 transition-colors text-sm">
                                <td className="p-2 border-r bg-gray-50 align-middle">
                                    <div className="flex flex-col items-center gap-2">
                                        <button type="button" onClick={() => handleMoveCommittee(idx, 'up')} disabled={idx===0} className="text-gray-500 hover:text-orange-600 disabled:opacity-20 hover:bg-gray-200 w-6 h-6 rounded-full flex items-center justify-center transition-all"><i className="fas fa-chevron-up"></i></button>
                                        <button type="button" onClick={() => handleMoveCommittee(idx, 'down')} disabled={idx===committeeMembers.length-1} className="text-gray-500 hover:text-orange-600 disabled:opacity-20 hover:bg-gray-200 w-6 h-6 rounded-full flex items-center justify-center transition-all"><i className="fas fa-chevron-down"></i></button>
                                    </div>
                                </td>
                                <td className="p-3">
                                   {m.image ? (
                                     <img src={m.image} alt={m.name} className="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" />
                                   ) : (
                                     <div className="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 text-lg border-2 border-white shadow-sm">
                                       <i className="fas fa-user"></i>
                                     </div>
                                   )}
                                </td>
                                <td className="p-4 font-bold text-gray-800 text-base">{m.name}</td>
                                <td className="p-4 text-orange-600 font-semibold">{m.role}</td>
                                <td className="p-4 text-center whitespace-nowrap">
                                  <button type="button" onClick={() => { setNewMember(m); setEditingCommitteeId(m.id); window.scrollTo(0,0); }} className="text-blue-600 hover:text-white hover:bg-blue-600 bg-blue-50 border border-blue-200 p-2 rounded-lg mr-2 transition-colors" title="এডিট">
                                    <i className="fas fa-edit w-5"></i>
                                  </button>
                                  <button type="button" onClick={() => handleDeleteMember(m.id)} className="text-red-600 hover:text-white hover:bg-red-600 bg-red-50 border border-red-200 p-2 rounded-lg transition-colors" title="ডিলিট">
                                    <i className="fas fa-trash w-5"></i>
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {activeTab === 'testimonials' && (
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                      <h3 className="text-xl font-bold text-gray-800 mb-6 border-b pb-3 flex items-center gap-2"><i className="fas fa-comment-dots text-orange-500"></i> {editingTestimonialId ? 'মতামত আপডেট করুন' : 'নতুন মতামত যোগ করুন'}</h3>
                      <form onSubmit={handleSaveTestimonial} className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10 bg-gray-50 p-6 rounded-2xl border border-gray-200 items-end shadow-inner">
                          <div>
                              <label className="block text-sm font-bold text-gray-700 mb-1">নাম <span className="text-red-500">*</span></label>
                              <input type="text" value={newTestimonial.name} onChange={e=>setNewTestimonial({...newTestimonial, name: e.target.value})} className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500" required placeholder="নাম লিখুন" />
                          </div>
                          <div>
                              <label className="block text-sm font-bold text-gray-700 mb-1">পদবী/ঠিকানা</label>
                              <input type="text" value={newTestimonial.designation} onChange={e=>setNewTestimonial({...newTestimonial, designation: e.target.value})} className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500" placeholder="পদবী লিখুন" />
                          </div>
                          <div>
                              <label className="block text-sm font-bold text-gray-700 mb-1">তারিখ</label>
                              <input type="date" value={newTestimonial.date} onChange={e=>setNewTestimonial({...newTestimonial, date: e.target.value})} className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-700 focus:ring-2 focus:ring-orange-500" />
                          </div>
                          <div className="md:col-span-2">
                              <label className="block text-sm font-bold text-gray-700 mb-1">মতামত <span className="text-red-500">*</span></label>
                              <textarea value={newTestimonial.text} onChange={e=>setNewTestimonial({...newTestimonial, text: e.target.value})} required className="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 min-h-[100px]" placeholder="মতামত লিখুন..."></textarea>

                                      <i className={d.is_hidden ? "fas fa-eye-slash w-5" : "fas fa-eye w-5"}></i>
                                    </button>
                                    <button type="button" onClick={() => { setNewDonation(d); setEditingDonationId(d.id); window.scrollTo(0,0); }} className="text-blue-600 hover:text-white hover:bg-blue-600 bg-blue-50 border border-blue-200 p-2 rounded-lg mr-2 transition-colors" title="এডিট">
                                      <i className="fas fa-edit w-5"></i>
                                    </button>
                                    <button type="button" onClick={() => handleDeleteDonation(d.id)} className="text-red-600 hover:text-white hover:bg-red-600 bg-red-50 border border-red-200 p-2 rounded-lg transition-colors" title="ডিলিট">
                                      <i className="fas fa-trash w-5"></i>
                                    </button>
                                  </td>
                                </tr>
                              ))}
                              {(!donations || donations.length === 0) && (
                                <tr><td colSpan="5" className="text-center p-6 text-gray-500">কোনো ডেটা নেই।</td></tr>
                              )}
                            </tbody>
                          </table>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          );
        };

        function App() {
          const [currentPage, setCurrentPage] = useState(() => {
              return window.location.hash.replace('#', '') || 'home';
          });
          
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isLoading, setIsLoading] = useState(true);
          const [dbError, setDbError] = useState(false);
          
          const [marqueeText, setMarqueeText] = useState('মন্দিরে স্বাগতম ✦ মায়ের আশীর্বাদ আপনার সহায় হোক ✦ ঐশ্বরিক উপস্থিতি অনুভব করুন');
          const [featuredTestimonialIds, setFeaturedTestimonialIds] = useState([]);
          const [committeeMembers, setCommitteeMembers] = useState([]);
          const [testimonials, setTestimonials] = useState([]);
          const [events, setEvents] = useState([]);
          const [notices, setNotices] = useState([]);
          const [donations, setDonations] = useState([]);
          
          const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
          
          // Global Toast State
          const [toastMsg, setToastMsg] = useState('');

          const showToast = (msg) => {
              setToastMsg(msg);
              setTimeout(() => setToastMsg(''), 3000);
          };

          useEffect(() => {
              const handleHashChange = () => {
                  const hash = window.location.hash.replace('#', '') || 'home';
                  setCurrentPage(hash);
              };
              window.addEventListener('hashchange', handleHashChange);
              return () => window.removeEventListener('hashchange', handleHashChange);
          }, []);

          useEffect(() => {
            fetchData();
            const checkSession = async () => {
              const { data: { session } } = await supabaseClient.auth.getSession();
              if (session) setIsAdminAuthenticated(true);
            };
            checkSession();
          }, []);

          const fetchData = async () => {
            setIsLoading(true);
            setDbError(false);
            try {
                const { data: settingsData } = await supabaseClient.from('settings').select('*');
                if(settingsData) {
                    const mq = settingsData.find(s => s.key === 'marquee');
                    if (mq) setMarqueeText(mq.value);
                    const ft = settingsData.find(s => s.key === 'featured_test_ids');
                    if (ft && ft.value) {
                        try { setFeaturedTestimonialIds(JSON.parse(ft.value)); } catch(e){}
                    }
                }

                const { data: committeeData } = await supabaseClient.from('committee').select('*').order('order_idx', { ascending: true }).order('id', { ascending: true });
                if(committeeData) setCommitteeMembers(committeeData);

                const { data: testimonialsData } = await supabaseClient.from('testimonials').select('*').order('date', { ascending: false }).order('id', { ascending: false });
                if(testimonialsData) setTestimonials(testimonialsData);

                const { data: eventsData } = await supabaseClient.from('events').select('*').order('date', { ascending: false }).order('id', { ascending: false });
                if(eventsData) setEvents(eventsData);
                
                const { data: noticesData } = await supabaseClient.from('notices').select('*').order('date', { ascending: false }).order('id', { ascending: false });
                if(noticesData) setNotices(noticesData);
                
                const { data: dData } = await supabaseClient.from('donations').select('*').order('id', { ascending: false });
                if(dData) setDonations(dData);

            } catch (error) {
                console.error("Supabase Database Error:", error);
                setDbError(true);
            } finally {
                setIsLoading(false);
            }
          };

          const navigateTo = (page) => {
            window.location.hash = page;
            setIsMenuOpen(false);
            window.scrollTo(0, 0);
          };

          const renderPage = () => {
            switch (currentPage) {
              case 'home': return <Home dbError={dbError} marqueeText={marqueeText} testimonials={testimonials} featuredTestimonialIds={featuredTestimonialIds} committeeMembers={committeeMembers} events={events} notices={notices} navigateTo={navigateTo} showToast={showToast} />;
              case 'committee': return <CommitteePage committeeMembers={committeeMembers} navigateTo={navigateTo} />;
              case 'testimonials': return <TestimonialsPage testimonials={testimonials} navigateTo={navigateTo} />;
              case 'donation': return <DonationPage donations={donations} navigateTo={navigateTo} />;
              case 'history': return <HistoryPage navigateTo={navigateTo} />;
              case 'event': return <EventsPage events={events} navigateTo={navigateTo} showToast={showToast} />;
              case 'notice': return <NoticeBoardPage notices={notices} navigateTo={navigateTo} />;
              case 'admin': return <AdminPanel 
                                      supabaseClient={supabaseClient} dbError={dbError} navigateTo={navigateTo}
                                      isAdminAuthenticated={isAdminAuthenticated} setIsAdminAuthenticated={setIsAdminAuthenticated}
                                      marqueeText={marqueeText} setMarqueeText={setMarqueeText}
                                      committeeMembers={committeeMembers} setCommitteeMembers={setCommitteeMembers}
                                      testimonials={testimonials} setTestimonials={setTestimonials}
                                      events={events} setEvents={setEvents} notices={notices} setNotices={setNotices}
                                      donations={donations} setDonations={setDonations}
                                      featuredTestimonialIds={featuredTestimonialIds} setFeaturedTestimonialIds={setFeaturedTestimonialIds}
                                      showToast={showToast}
                                    />;
              default: return <Home dbError={dbError} marqueeText={marqueeText} testimonials={testimonials} featuredTestimonialIds={featuredTestimonialIds} committeeMembers={committeeMembers} events={events} notices={notices} navigateTo={navigateTo} showToast={showToast} />;
            }
          };

          return (
            <div className="font-sans text-gray-900 selection:bg-yellow-300 selection:text-orange-900 overflow-x-hidden relative">
              
              {/* Global Toast Message */}
              {toastMsg && (
                <div className="fixed bottom-10 right-10 z-[100] bg-green-600 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 font-bold text-lg toast-animate border border-green-500">
                  <i className="fas fa-check-circle text-2xl"></i> {toastMsg}
                </div>
              )}

              {currentPage !== 'admin' && <Header navigateTo={navigateTo} isMenuOpen={isMenuOpen} setIsMenuOpen={setIsMenuOpen} />}
              <main className="min-h-screen bg-white">
                {isLoading && currentPage === 'home' ? (
                   <div className="flex flex-col gap-4 items-center justify-center h-screen bg-orange-50">
                      <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-orange-600 drop-shadow-md"></div>
                      <p className="text-orange-800 font-bold tracking-widest animate-pulse">লোড হচ্ছে...</p>
                   </div>
                ) : (
                   renderPage()
                )}
              </main>
              {currentPage !== 'admin' && <Footer navigateTo={navigateTo} />}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
