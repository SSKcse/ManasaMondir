<!DOCTYPE html>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://manasamondirgoila.com/">
    <meta property="og:title" content="শ্রী শ্রী মা মনসা মন্দির, গৈলা">
    <meta property="og:description" content="কবি বিজয় গুপ্তের প্রতিষ্ঠিত ঐতিহাসিক মন্দির। মায়ের আশীর্বাদে সবার জীবনে শান্তি ও সমৃদ্ধি নেমে আসুক।">
    <meta property="og:image" content="header image.jpg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f3f4f6; 
            overscroll-behavior-y: none; 
        }
        
        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* Marquee */
        .marquee-wrapper { width: 100%; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        
        /* App Specific Utilities */
        .hide-scroll { -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
        .snap-item { scroll-snap-align: start; }
        
        .app-container { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); position: relative; }
        
        .toast-animate { animation: slideUpToast 0.3s ease-out forwards; }
        @keyframes slideUpToast { 0% { transform: translateY(100px) translateX(-50%); opacity: 0; } 100% { transform: translateY(0) translateX(-50%); opacity: 1; } }

        .fab-button { box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4); }
        
        /* Bottom Sheet Menu Animation */
        .bottom-sheet-animate { animation: slideUpBottomSheet 0.3s cubic-bezier(0.175, 0.885, 0.32, 1) forwards; }
        @keyframes slideUpBottomSheet { 0% { transform: translateY(100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* Glowing Avatar Animation */
        @keyframes spiritualGlow {
            0% { box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
            50% { box-shadow: 0 0 40px rgba(250, 204, 21, 0.9), 0 0 20px rgba(249, 115, 22, 0.8); }
            100% { box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        }
        .spiritual-avatar { animation: spiritualGlow 3s infinite alternate; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Supabase Config ---
        const SUPABASE_URL = 'https://abdgizkkfyhewehfearj.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_MsM2-K03tGNU3G-WWZvYUA_lKu53oT9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const galleryImages = ['header image.jpg', 'gallary image.png', 'ma manasa mondir font.jpg', 'ma manasa mondir lake dighi view.jpg'];

        const englishToBengaliNumber = (engStr) => {
            if (!engStr) return '';
            const benDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            return engStr.toString().replace(/\d/g, d => benDigits[d]);
        };

        const formatDateToBengali = (dateStr) => {
            if (!dateStr) return '';
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return englishToBengaliNumber(dateStr); 
            const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
            const [y, m, d] = dateStr.split('-');
            return `${englishToBengaliNumber(parseInt(d, 10))} ${months[parseInt(m, 10) - 1]}, ${englishToBengaliNumber(y)}`;
        };

        const shareEvent = async (ev, showToast) => {
            const shareData = {
                title: ev.title,
                text: `${ev.title}\n\n${ev.description}\n\nতারিখ: ${formatDateToBengali(ev.date)}\n\nবিস্তারিত জানতে ভিজিট করুন: `,
                url: window.location.origin + window.location.pathname + '#event'
            };
            try {
                if (navigator.share) await navigator.share(shareData);
                else {
                    await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`);
                    showToast('তথ্য কপি করা হয়েছে!');
                }
            } catch (err) { console.log('Share error', err); }
        };

        const BackButton = ({ navigateTo }) => (
            <button onClick={() => navigateTo('home')} className="mb-6 inline-flex items-center gap-2 text-orange-700 font-bold bg-orange-100/80 px-5 py-2.5 rounded-full hover:bg-orange-200 transition-colors shadow-sm border border-orange-200">
                <i className="fas fa-arrow-left"></i> হোমে ফিরে যান
            </button>
        );

        // --- App Top Bar (Native Style) ---
        const AppTopBar = ({ page, navigateTo }) => {
            const pageTitles = {
                'history': 'ইতিহাস ও ঐতিহ্য',
                'committee': 'পরিচালনা পর্ষদ',
                'event': 'ইভেন্টসমূহ',
                'notice': 'নোটিশ বোর্ড',
                'donation': 'প্রণামী ও অনুদান',
                'contact': 'যোগাযোগ',
                'developer': 'ডেভেলপার পরিচিতি'
            };

            if (page === 'home') {
                return (
                    <div className="bg-white sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-[0_2px_10px_rgba(0,0,0,0.05)]">
                        <div className="flex items-center gap-3">
                            <img src="logo (1).jpg" alt="Logo" className="w-10 h-10 rounded-full border-2 border-orange-100 shadow-sm object-cover" />
                            <div className="flex flex-col">
                                <h1 className="font-bold text-lg text-gray-800 leading-tight tracking-tight">শ্রী শ্রী মা মনসা মন্দির</h1>
                                <p className="text-[10px] text-gray-500 flex items-center gap-1"><i className="fas fa-map-marker-alt text-orange-500"></i> গৈলা, আগৈলঝাড়া</p>
                            </div>
                        </div>
                        <button onClick={() => navigateTo('notice')} className="w-10 h-10 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center relative active:scale-95 transition-transform">
                            <i className="fas fa-bell text-lg"></i>
                            <span className="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full border border-white animate-pulse"></span>
                        </button>
                    </div>
                );
            }

            return (
                <div className="bg-white sticky top-0 z-40 px-4 py-3 flex items-center gap-4 shadow-[0_2px_10px_rgba(0,0,0,0.05)]">
                    <button onClick={() => navigateTo('home')} className="w-10 h-10 rounded-full text-gray-700 hover:bg-gray-100 flex items-center justify-center active:scale-95 transition-transform">
                        <i className="fas fa-arrow-left text-lg"></i>
                    </button>
                    <h1 className="font-bold text-lg text-gray-800">{pageTitles[page] || ''}</h1>
                </div>
            );
        };

        // --- App Bottom Navigation ---
        const BottomNav = ({ currentPage, navigateTo, isMenuOpen, setIsMenuOpen }) => (
            <>
                {/* Beautiful Bottom Sheet Menu */}
                {isMenuOpen && (
                  <div className="fixed inset-0 bg-black/50 z-[45] backdrop-blur-sm" onClick={() => setIsMenuOpen(false)}>
                    <div className="absolute bottom-[65px] left-0 w-full max-w-[480px] mx-auto right-0 bg-white rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.1)] flex flex-col font-medium overflow-hidden pb-4 bottom-sheet-animate" onClick={e => e.stopPropagation()}>
                        <div className="w-12 h-1.5 bg-gray-300 rounded-full mx-auto my-3"></div>
                        <div className="grid grid-cols-4 gap-2 p-5 pt-2">
                            <button onClick={() => {navigateTo('history'); setIsMenuOpen(false)}} className="flex flex-col items-center gap-2 p-2 rounded-2xl active:bg-orange-50 transition-colors">
                                <div className="w-12 h-12 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-xl"><i className="fas fa-book-open"></i></div>
                                <span className="text-[10px] text-gray-700 text-center font-bold">ইতিহাস</span>
                            </button>
                            <button onClick={() => {navigateTo('committee'); setIsMenuOpen(false)}} className="flex flex-col items-center gap-2 p-2 rounded-2xl active:bg-blue-50 transition-colors">
                                <div className="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl"><i className="fas fa-users"></i></div>
                                <span className="text-[10px] text-gray-700 text-center font-bold">কমিটি</span>
                            </button>
                            <button onClick={() => {navigateTo('contact'); setIsMenuOpen(false)}} className="flex flex-col items-center gap-2 p-2 rounded-2xl active:bg-green-50 transition-colors">
                                <div className="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-xl"><i className="fas fa-map-marked-alt"></i></div>
                                <span className="text-[10px] text-gray-700 text-center font-bold">যোগাযোগ</span>
                            </button>
                            <button onClick={() => {navigateTo('developer'); setIsMenuOpen(false)}} className="flex flex-col items-center gap-2 p-2 rounded-2xl active:bg-purple-50 transition-colors">
                                <div className="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xl"><i className="fas fa-code"></i></div>
                                <span className="text-[10px] text-gray-700 text-center font-bold">ডেভেলপার</span>
                            </button>
                        </div>
                    </div>
                  </div>
                )}

                <div className="fixed bottom-0 w-full max-w-[480px] left-1/2 -translate-x-1/2 bg-white border-t border-gray-100 flex justify-around items-end pb-2 pt-2 z-50 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
                    <button onClick={() => {navigateTo('home'); setIsMenuOpen(false)}} className={`flex flex-col items-center p-1 w-1/5 ${currentPage === 'home' ? 'text-orange-600' : 'text-gray-400'}`}>
                        <i className={`text-[22px] mb-1 ${currentPage === 'home' ? 'fas fa-home' : 'fa-solid fa-house-chimney'}`}></i>
                        <span className="text-[10px] font-bold">হোম</span>
                    </button>
                    <button onClick={() => {navigateTo('event'); setIsMenuOpen(false)}} className={`flex flex-col items-center p-1 w-1/5 ${currentPage === 'event' ? 'text-orange-600' : 'text-gray-400'}`}>
                        <i className="fas fa-calendar-alt text-[22px] mb-1"></i>
                        <span className="text-[10px] font-bold">ইভেন্ট</span>
                    </button>
                    
                    <button onClick={() => {navigateTo('donation'); setIsMenuOpen(false)}} className="flex flex-col items-center w-1/5 relative -top-6">
                        <div className="bg-gradient-to-tr from-orange-500 to-red-500 w-14 h-14 rounded-full flex items-center justify-center text-white fab-button border-4 border-white">
                            <i className="fas fa-hand-holding-usd text-2xl"></i>
                        </div>
                        <span className={`text-[10px] font-bold mt-1 ${currentPage === 'donation' ? 'text-orange-600' : 'text-gray-600'}`}>প্রণামী</span>
                    </button>

                    <button onClick={() => {navigateTo('notice'); setIsMenuOpen(false)}} className={`flex flex-col items-center p-1 w-1/5 ${currentPage === 'notice' ? 'text-orange-600' : 'text-gray-400'}`}>
                        <i className="fas fa-bullhorn text-[22px] mb-1"></i>
                        <span className="text-[10px] font-bold">নোটিশ</span>
                    </button>
                    <button onClick={() => setIsMenuOpen(!isMenuOpen)} className={`flex flex-col items-center p-1 w-1/5 ${isMenuOpen || ['history', 'committee', 'developer', 'contact'].includes(currentPage) ? 'text-orange-600' : 'text-gray-400'}`}>
                        <i className={`fas fa-grip-lines text-[22px] mb-1 transition-transform ${isMenuOpen ? 'text-orange-600' : ''}`}></i>
                        <span className="text-[10px] font-bold">মেনু</span>
                    </button>
                </div>
            </>
        );

        // --- Pages ---
        const Home = ({ marqueeText, testimonials, featuredTestimonialIds, events, notices, navigateTo, showToast }) => {
          const [currentBanner, setCurrentBanner] = useState(0);
          
          const featuredTests = testimonials.filter(t => featuredTestimonialIds.includes(t.id));
          const displayTests = featuredTests.length > 0 ? featuredTests : testimonials.slice(0, 3);

          // Auto Slide Banner
          useEffect(() => {
            const timer = setInterval(() => setCurrentBanner(p => (p + 1) % galleryImages.length), 4000);
            return () => clearInterval(timer);
          }, []);

          return (
            <div className="bg-gray-50 pb-[100px] min-h-screen">
              {/* Marquee Ticker */}
              <div className="bg-orange-100 text-orange-800 py-1.5 flex items-center px-2">
                <i className="fas fa-bolt text-orange-600 text-xs mr-2 animate-pulse"></i>
                <div className="marquee-wrapper text-xs font-semibold">
                  <div className="marquee-text">{marqueeText}</div>
                </div>
              </div>

              {/* App Hero Banner Carousel */}
              <div className="p-4">
                  <div className="w-full h-48 rounded-3xl overflow-hidden relative shadow-md bg-black">
                      {galleryImages.map((img, idx) => (
                          <div key={idx} className={`absolute inset-0 transition-opacity duration-1000 ${idx === currentBanner ? 'opacity-100' : 'opacity-0'}`}>
                              <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent z-10"></div>
                              <img src={img} className="w-full h-full object-cover" alt="Temple" />
                          </div>
                      ))}
                      <div className="absolute bottom-4 left-4 z-20">
                          <span className="bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider mb-1 block w-fit">ঐতিহ্যবাহী</span>
                          <h2 className="text-white font-bold text-xl font-serif leading-tight text-shadow">শ্রী শ্রী মা মনসা মন্দির</h2>
                      </div>
                      <div className="absolute bottom-4 right-4 flex gap-1 z-20">
                          {galleryImages.map((_, i) => (
                             <div key={i} className={`h-1.5 rounded-full transition-all ${i === currentBanner ? 'w-4 bg-orange-500' : 'w-1.5 bg-white/50'}`}></div>
                          ))}
                      </div>
                  </div>
              </div>

              {/* Quick Actions Grid */}
              <div className="px-4 mb-6">
                  <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 grid grid-cols-4 gap-2">
                      <button onClick={()=>navigateTo('history')} className="flex flex-col items-center gap-2 active:scale-95 transition-transform">
                          <div className="w-12 h-12 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center text-lg"><i className="fas fa-scroll"></i></div>
                          <span className="text-[10px] font-bold text-gray-700">ইতিহাস</span>
                      </button>
                      <button onClick={()=>navigateTo('donation')} className="flex flex-col items-center gap-2 active:scale-95 transition-transform">
                          <div className="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-lg"><i className="fas fa-gift"></i></div>
                          <span className="text-[10px] font-bold text-gray-700">প্রণামী</span>
                      </button>
                      <button onClick={()=>navigateTo('committee')} className="flex flex-col items-center gap-2 active:scale-95 transition-transform">
                          <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-lg"><i className="fas fa-users"></i></div>
                          <span className="text-[10px] font-bold text-gray-700">কমিটি</span>
                      </button>
                      <button onClick={()=>navigateTo('contact')} className="flex flex-col items-center gap-2 active:scale-95 transition-transform">
                          <div className="w-12 h-12 bg-green-50 text-green-600 rounded-full flex items-center justify-center text-lg"><i className="fas fa-map-marked-alt"></i></div>
                          <span className="text-[10px] font-bold text-gray-700">যোগাযোগ</span>
                      </button>
                  </div>
              </div>

              {/* Horizontal Latest Events */}
              <div className="pl-4 mb-8">
                  <div className="flex justify-between items-center pr-4 mb-3">
                      <h3 className="font-bold text-gray-800 text-lg">সর্বশেষ ইভেন্ট</h3>
                      <button onClick={()=>navigateTo('event')} className="text-orange-600 text-xs font-bold bg-orange-50 px-3 py-1 rounded-full">সব দেখুন</button>
                  </div>
                  <div className="flex gap-4 overflow-x-auto hide-scroll pb-4 pr-4">
                      {events.slice(0, 4).map(ev => (
                          <div key={ev.id} className="min-w-[240px] max-w-[240px] bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden snap-item shrink-0">
                              {ev.image ? (
                                  <div className="h-28 w-full bg-gray-200 relative">
                                      <img src={ev.image} className="w-full h-full object-cover" alt="Event" />
                                      <div className="absolute top-2 left-2 bg-black/60 text-white text-[10px] px-2 py-1 rounded backdrop-blur-sm"><i className="fas fa-calendar-alt"></i> {formatDateToBengali(ev.date)}</div>
                                  </div>
                              ) : (
                                  <div className="h-28 w-full bg-gradient-to-br from-orange-400 to-orange-600 flex flex-col items-center justify-center text-white relative">
                                      <i className="fas fa-calendar-star text-3xl opacity-50 mb-1"></i>
                                      <div className="text-xs font-bold">{formatDateToBengali(ev.date)}</div>
                                  </div>
                              )}
                              <div className="p-3 flex flex-col flex-grow">
                                  <h4 className="font-bold text-gray-800 text-sm line-clamp-1 mb-1">{ev.title}</h4>
                                  <p className="text-xs text-gray-500 line-clamp-2 leading-relaxed">{ev.description}</p>
                              </div>
                          </div>
                      ))}
                      {events.length === 0 && <div className="text-xs text-gray-500 bg-white px-4 py-8 rounded-2xl w-full text-center border border-gray-100">কোনো ইভেন্ট নেই</div>}
                  </div>
              </div>

              {/* Notice Board List */}
              <div className="px-4 mb-8">
                  <div className="flex justify-between items-center mb-3">
                      <h3 className="font-bold text-gray-800 text-lg">জরুরি নোটিশ</h3>
                      <button onClick={()=>navigateTo('notice')} className="text-orange-600 text-xs font-bold bg-orange-50 px-3 py-1 rounded-full">সব দেখুন</button>
                  </div>
                  <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 flex flex-col gap-3">
                      {notices.slice(0, 3).map((n, i) => (
                          <div key={n.id} className={`pb-3 ${i !== Math.min(notices.length, 3)-1 ? 'border-b border-gray-50' : ''}`}>
                              <div className="flex justify-between items-start mb-1 gap-2">
                                  <h4 className="font-bold text-gray-800 text-sm leading-tight"><i className="fas fa-bell text-blue-500 text-xs mr-1"></i> {n.title}</h4>
                                  <span className="text-[9px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold shrink-0">{formatDateToBengali(n.date)}</span>
                              </div>
                              <p className="text-xs text-gray-500 line-clamp-2 pl-4">{n.text}</p>
                          </div>
                      ))}
                      {notices.length === 0 && <p className="text-xs text-center text-gray-400 py-2">কোনো নোটিশ নেই</p>}
                  </div>
              </div>

              {/* Devotee Spotlight */}
              <div className="px-4 mb-8">

                    <i className="fas fa-code"></i>
                  </div>
                  <h1 className="text-2xl font-bold text-gray-900 mb-2 font-serif">ডেভেলপার পরিচিতি</h1>
                  <p className="text-xs text-gray-500">অ্যাপটির কারিগরি ও উন্নয়নের নেপথ্যে</p>
                </div>
            </div>

            <div className="px-4">
                <div className="bg-white shadow-sm rounded-3xl p-8 border border-gray-100 space-y-6">
                    <div className="flex flex-col items-center text-center gap-4">
                        <div className="w-32 h-32 rounded-full border-4 border-orange-100 overflow-hidden shadow-md">
                            <img src="developer.jpg" alt="Shuvo Karmaker" className="w-full h-full object-cover" onError={(e) => {e.target.onerror = null; e.target.src = 'https://ui-avatars.com/api/?name=Shuvo+Karmaker&background=ea580c&color=fff'}} />
                        </div>
                        <div>
                            <h4 className="font-bold text-gray-900 text-xl">Shuvo Karmaker</h4>
                            <p className="text-sm font-bold text-orange-600 mb-4">BSc in CSE</p>
                            
                            <div className="space-y-2 text-sm text-gray-700 mb-6">
                                <p className="font-medium bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">Researcher & Innovator,<br/>SSK Innovation Lab - SSKIL</p>
                                <p className="font-medium bg-gray-50 px-4 py-2 rounded-xl border border-gray-100">Vice Chairperson,<br/>IEEE Computer Society Bangladesh Chapter</p>
                            </div>
                            
                            <div className="flex flex-col gap-3 w-full max-w-[280px] mx-auto">
                                <a href="tel:01706105757" className="bg-blue-50 flex items-center justify-center gap-2 p-3 rounded-xl border border-blue-100 text-blue-700 text-sm font-bold hover:bg-blue-100 transition-colors shadow-sm">
                                    <i className="fas fa-phone-alt"></i> 01706105757
                                </a>
                                <a href="mailto:sskshuvo.cse@gmail.com" className="bg-orange-50 flex items-center justify-center gap-2 p-3 rounded-xl border border-orange-100 text-orange-700 text-sm font-bold hover:bg-orange-100 transition-colors shadow-sm">
                                    <i className="fas fa-envelope"></i> sskshuvo.cse@gmail.com
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          </div>
        );

        function App() {
          const [currentPage, setCurrentPage] = useState(() => window.location.hash.replace('#', '') || 'home');
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isLoading, setIsLoading] = useState(true);
          const [dbError, setDbError] = useState(false);
          
          // Data States
          const [marqueeText, setMarqueeText] = useState('মন্দিরে স্বাগতম ✦ মায়ের আশীর্বাদ আপনার সহায় হোক');
          const [featuredTestimonialIds, setFeaturedTestimonialIds] = useState([]);
          const [committeeMembers, setCommitteeMembers] = useState([]);
          const [testimonials, setTestimonials] = useState([]);
          const [events, setEvents] = useState([]);
          const [notices, setNotices] = useState([]);
          const [donations, setDonations] = useState([]);
          const [toastMsg, setToastMsg] = useState('');

          const showToast = (msg) => {
              setToastMsg(msg);
              setTimeout(() => setToastMsg(''), 3000);
          };

          useEffect(() => {
              const handleHashChange = () => {
                  const hash = window.location.hash.replace('#', '') || 'home';
                  setCurrentPage(hash);
                  setIsMenuOpen(false); 
              };
              window.addEventListener('hashchange', handleHashChange);
              return () => window.removeEventListener('hashchange', handleHashChange);
          }, []);

          // Data Fetching and Polling for Notifications
          useEffect(() => { 
              fetchData(); 
              
              // Polling for notices (Notifications)
              const pollInterval = setInterval(async () => {
                  if (Notification.permission === "granted") {
                      try {
                          const { data: latestNotices } = await supabaseClient
                              .from('notices')
                              .select('*')
                              .order('id', { ascending: false })
                              .limit(1);

                          if (latestNotices && latestNotices.length > 0) {
                              const latestNotice = latestNotices[0];
                              const lastSeenId = localStorage.getItem('lastSeenNoticeId');
                              
                              if (!lastSeenId || latestNotice.id > parseInt(lastSeenId)) {
                                  // Trigger Push Notification
                                  if ('serviceWorker' in navigator) {
                                      navigator.serviceWorker.ready.then(sw => {
                                          sw.showNotification("মন্দিরের নতুন নোটিশ", {
                                              body: latestNotice.title,
                                              icon: "logo (1).jpg",
                                              vibrate: [200, 100, 200]
                                          });
                                      });
                                  } else {
                                      new Notification("মন্দিরের নতুন নোটিশ", {
                                          body: latestNotice.title,
                                          icon: "logo (1).jpg"
                                      });
                                  }
                                  localStorage.setItem('lastSeenNoticeId', latestNotice.id);
                              }
                          }
                      } catch (e) {
                          console.log("Polling error", e);
                      }
                  }
              }, 30000); // Checks every 30 seconds

              return () => clearInterval(pollInterval);
          }, []);

          const fetchData = async () => {
            setIsLoading(true);
            setDbError(false);
            try {
                const { data: settingsData } = await supabaseClient.from('settings').select('*');
                if(settingsData) {
                    const mq = settingsData.find(s => s.key === 'marquee');
                    if (mq) setMarqueeText(mq.value);
                    const ft = settingsData.find(s => s.key === 'featured_test_ids');
                    if (ft && ft.value) { try { setFeaturedTestimonialIds(JSON.parse(ft.value)); } catch(e){} }
                }

                const { data: committeeData } = await supabaseClient.from('committee').select('*').order('order_idx', { ascending: true }).order('id', { ascending: true });
                if(committeeData) setCommitteeMembers(committeeData);

                const { data: testimonialsData } = await supabaseClient.from('testimonials').select('*').order('date', { ascending: false }).order('id', { ascending: false });
                if(testimonialsData) setTestimonials(testimonialsData);

                const { data: eventsData } = await supabaseClient.from('events').select('*').order('date', { ascending: false }).order('id', { ascending: false });
                if(eventsData) setEvents(eventsData);
                
                const { data: noticesData } = await supabaseClient.from('notices').select('*').order('date', { ascending: false }).order('id', { ascending: false });
                if(noticesData) {
                    setNotices(noticesData);
                    if(noticesData.length > 0 && !localStorage.getItem('lastSeenNoticeId')) {
                        localStorage.setItem('lastSeenNoticeId', noticesData[0].id);
                    }
                }
                
                const { data: dData } = await supabaseClient.from('donations').select('*').order('id', { ascending: false });
                if(dData) setDonations(dData);

            } catch (error) {
                console.error("Supabase Database Error:", error);
                setDbError(true);
            } finally {
                setIsLoading(false);
            }
          };

          const navigateTo = (page) => {
            window.location.hash = page;
            window.scrollTo(0, 0);
          };

          const renderPage = () => {
            switch (currentPage) {
              case 'home': return <Home dbError={dbError} marqueeText={marqueeText} testimonials={testimonials} featuredTestimonialIds={featuredTestimonialIds} committeeMembers={committeeMembers} events={events} notices={notices} navigateTo={navigateTo} showToast={showToast} />;
              case 'committee': return <CommitteePage committeeMembers={committeeMembers} navigateTo={navigateTo} />;
              case 'donation': return <DonationPage donations={donations} navigateTo={navigateTo} />;
              case 'history': return <HistoryPage navigateTo={navigateTo} />;
              case 'event': return <EventsPage events={events} navigateTo={navigateTo} showToast={showToast} />;
              case 'notice': return <NoticeBoardPage notices={notices} navigateTo={navigateTo} showToast={showToast} />;
              case 'contact': return <ContactPage navigateTo={navigateTo} />;
              case 'developer': return <DeveloperPage navigateTo={navigateTo} />;
              default: return <Home dbError={dbError} marqueeText={marqueeText} testimonials={testimonials} featuredTestimonialIds={featuredTestimonialIds} committeeMembers={committeeMembers} events={events} notices={notices} navigateTo={navigateTo} showToast={showToast} />;
            }
          };

          return (
            <div className="app-container font-sans text-gray-900 selection:bg-yellow-300 selection:text-orange-900 overflow-x-hidden relative bg-gray-50 pb-[70px]">
              
              {/* Toast Message */}
              {toastMsg && (
                <div className="fixed top-16 left-1/2 -translate-x-1/2 z-[100] bg-gray-800 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 font-bold text-xs border border-gray-700 toast-animate w-max whitespace-nowrap">
                  <i className="fas fa-check-circle text-green-400 text-base"></i> {toastMsg}
                </div>
              )}

              <AppTopBar page={currentPage} navigateTo={navigateTo} />
              
              <main className="w-full">
                {isLoading && currentPage === 'home' ? (
                   <div className="flex flex-col gap-3 items-center justify-center h-screen bg-gray-50">
                      <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-orange-600"></div>
                      <p className="text-gray-500 font-bold text-xs tracking-widest animate-pulse">লোড হচ্ছে...</p>
                   </div>
                ) : renderPage() }
              </main>
              
              {/* Mobile Bottom Navigation */}
              <BottomNav currentPage={currentPage} navigateTo={navigateTo} isMenuOpen={isMenuOpen} setIsMenuOpen={setIsMenuOpen} />
              
              {/* Fake Service Worker Script for PWA validation & Notifications */}
              <script dangerouslySetInnerHTML={{__html: `
                if ('serviceWorker' in navigator) {
                  window.addEventListener('load', () => {
                    navigator.serviceWorker.register('data:application/javascript;base64,LyoqIFNlcnZpY2UgV29ya2VyICov/').catch(()=>{});
                  });
                }
              `}} />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
